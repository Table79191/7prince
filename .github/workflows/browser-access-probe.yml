name: Browser Access Probe Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/browser-access-probe.yml"
      - "browser-access-probe/**"

permissions:
  contents: read

jobs:
  probe-namuwiki:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: browser-access-probe
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            browser-access-probe
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Probe NamuWiki page
        continue-on-error: true
        run: |
          npm run auto -- 'https://namu.wiki/w/%EC%9D%B4%EC%9E%AC%EB%AA%85%20%ED%94%BC%EC%8A%B5%20%EC%82%AC%EA%B1%B4' --out ./artifacts
      - name: Print probe report
        if: always()
        run: |
          shopt -s nullglob
          files=(artifacts/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No report generated"
            exit 0
          fi
          cat "${files[-1]}"
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namuwiki-probe
          path: browser-access-probe/artifacts/
          if-no-files-found: warn
