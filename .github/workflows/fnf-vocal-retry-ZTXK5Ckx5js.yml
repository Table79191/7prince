name: FNF Vocal Separation Retry ZTXK5Ckx5js

on:
  push:
    paths:
      - ".github/workflows/fnf-vocal-retry-ZTXK5Ckx5js.yml"

permissions:
  contents: read

jobs:
  separate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out tool
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ogg-extractor
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade numpy "yt-dlp[default]" demucs

      - name: Prepare cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          test -n "${YOUTUBE_COOKIES:-}"
          COOKIE_FILE="$RUNNER_TEMP/youtube-cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES" > "$COOKIE_FILE"
          chmod 600 "$COOKIE_FILE"
          head -n 1 "$COOKIE_FILE" | grep -Eq '^# (Netscape HTTP Cookie File|HTTP Cookie File)$'

      - name: Download source
        run: |
          mkdir -p input output
          yt-dlp             --no-playlist             --js-runtimes node             --remote-components ejs:github             --cookies "$RUNNER_TEMP/youtube-cookies.txt"             -x --audio-format wav             -o "input/source.%(ext)s"             "https://www.youtube.com/watch?v=ZTXK5Ckx5js&list=RDZTXK5Ckx5js&index=1"
          test -s input/source.wav

      - name: Fine-tuned vocal separation
        run: |
          demucs             --two-stems=vocals             -n htdemucs_ft             --overlap 0.50             --shifts 2             -o separated_ft             input/source.wav
          test -s separated_ft/htdemucs_ft/source/vocals.wav

      - name: Export raw FT vocal
        run: |
          ffmpeg -hide_banner -loglevel error -y             -i separated_ft/htdemucs_ft/source/vocals.wav             -c:a libvorbis -q:a 9             output/ZTXK5Ckx5js-vocals-ft-raw.ogg

      - name: Export gentle clean FT vocal
        run: |
          ffmpeg -hide_banner -loglevel error -y             -i separated_ft/htdemucs_ft/source/vocals.wav             -af "highpass=f=35,lowpass=f=19000,afftdn=nr=3:nf=-55:tn=1"             -c:a libvorbis -q:a 9             output/ZTXK5Ckx5js-vocals-ft-clean.ogg

      - name: Verify
        run: |
          for f in output/*.ogg; do
            test -s "$f"
            ffprobe -v error               -select_streams a:0               -show_entries stream=codec_name,channels:format=duration               -of default=nw=1 "$f"
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ZTXK5Ckx5js-vocals-retry
          path: output/*.ogg
          if-no-files-found: error
          retention-days: 1
