name: Inspect FNF Dialogue Metadata ZTXK5Ckx5js

on:
  push:
    paths:
      - ".github/workflows/inspect-fnf-dialogue-meta-ZTXK5Ckx5js.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"
      - name: Prepare cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube-cookies.txt"
          chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
      - name: Print metadata and subtitles
        run: |
          URL="https://www.youtube.com/watch?v=ZTXK5Ckx5js"
          echo "=== METADATA ==="
          yt-dlp --cookies "$RUNNER_TEMP/youtube-cookies.txt" --js-runtimes node --remote-components ejs:github             --skip-download --print "TITLE=%(title)s" --print "CHANNEL=%(channel)s" --print "DURATION=%(duration_string)s" "$URL"
          echo "=== SUBTITLES ==="
          yt-dlp --cookies "$RUNNER_TEMP/youtube-cookies.txt" --js-runtimes node --remote-components ejs:github             --skip-download --list-subs "$URL" || true
