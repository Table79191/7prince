name: OGG Extractor

on:
  push:
    paths:
      - "ogg-extractor/**"
      - ".github/workflows/ogg-extractor.yml"
  workflow_dispatch:
    inputs:
      source:
        description: "Authorized media URL; leave blank to run the smoke test"
        required: false
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out OGG tool only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ogg-extractor
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependency
        run: python -m pip install --upgrade -r ogg-extractor/requirements.txt

      - name: Extract authorized URL
        if: github.event_name == 'workflow_dispatch' && inputs.source != ''
        env:
          SOURCE: ${{ inputs.source }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          mkdir -p output

          COOKIE_ARGS=()
          if [[ "$SOURCE" == *"youtube.com"* || "$SOURCE" == *"youtu.be"* ]]; then
            if [[ -z "${YOUTUBE_COOKIES:-}" ]]; then
              echo "::error::YouTube extraction requires the YOUTUBE_COOKIES repository secret."
              exit 1
            fi

            COOKIE_FILE="$RUNNER_TEMP/youtube-cookies.txt"
            printf '%s' "$YOUTUBE_COOKIES" > "$COOKIE_FILE"
            chmod 600 "$COOKIE_FILE"
            COOKIE_ARGS=(--cookies "$COOKIE_FILE")
          fi

          python ogg-extractor/extract_ogg.py \
            "$SOURCE" \
            -o output/extracted.ogg \
            "${COOKIE_ARGS[@]}"

      - name: Run synthetic smoke test
        if: github.event_name != 'workflow_dispatch' || inputs.source == ''
        run: |
          mkdir -p output
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=440:duration=1" \
            -c:a pcm_s16le output/smoke-input.wav
          python ogg-extractor/extract_ogg.py \
            output/smoke-input.wav \
            -o output/smoke.ogg

      - name: Verify OGG output
        run: |
          OGG_FILE="$(find output -maxdepth 1 -type f -name '*.ogg' | head -n 1)"
          test -n "$OGG_FILE"
          ffprobe -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of default=nw=1:nk=1 \
            "$OGG_FILE" | grep -Fx vorbis

      - name: Upload OGG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogg-output
          path: output/*.ogg
          if-no-files-found: error
          retention-days: 1
