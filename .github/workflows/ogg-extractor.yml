name: OGG Extractor

on:
  push:
    paths:
      - "ogg-extractor/**"
      - ".github/workflows/ogg-extractor.yml"
  workflow_dispatch:
    inputs:
      source:
        description: "Authorized media URL; leave blank to run the smoke test"
        required: false
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependency
        run: python -m pip install --upgrade -r ogg-extractor/requirements.txt

      - name: Extract authorized URL
        if: github.event_name == 'workflow_dispatch' && inputs.source != ''
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          mkdir -p output
          python ogg-extractor/extract_ogg.py "$SOURCE" -o output/extracted.ogg

      - name: Run synthetic smoke test
        if: github.event_name != 'workflow_dispatch' || inputs.source == ''
        run: |
          mkdir -p output
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=440:duration=1" \
            -c:a pcm_s16le output/smoke-input.wav
          python ogg-extractor/extract_ogg.py \
            output/smoke-input.wav \
            -o output/smoke.ogg

      - name: Verify OGG output
        run: |
          OGG_FILE="$(find output -maxdepth 1 -type f -name '*.ogg' | head -n 1)"
          test -n "$OGG_FILE"
          ffprobe -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of default=nw=1:nk=1 \
            "$OGG_FILE" | grep -Fx vorbis

      - name: Upload OGG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogg-output
          path: output/*.ogg
          if-no-files-found: error
          retention-days: 1
