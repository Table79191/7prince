name: Persist R015 Original Candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/persist-r015-original.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download accepted R015 artifact
        uses: actions/download-artifact@v4
        with:
          name: sentencelab-r015-original-accumulated
          path: /tmp/r015
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Table79191/7prince
          run-id: 35371403834

      - name: Persist checkpoint and reports
        run: |
          cp /tmp/r015/r015_accumulated_final_role.pt english-sentence-lab/artifacts/v1.8.5_r015_accumulated_final_role.pt
          cp /tmp/r015/r015_accumulated_final_metrics.json english-sentence-lab/artifacts/v1.8.5_r015_accumulated_final_metrics.json
          cp /tmp/r015/r015_shared_hard_before.json english-sentence-lab/artifacts/v1.8.5_r015_shared_hard_before.json
          cp /tmp/r015/r015_shared_hard_after.json english-sentence-lab/artifacts/v1.8.5_r015_shared_hard_after.json
          cp /tmp/r015/r015_comparison.json english-sentence-lab/artifacts/v1.8.5_r015_comparison.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english-sentence-lab/artifacts/v1.8.5_r015_accumulated_final_role.pt
          git add english-sentence-lab/artifacts/v1.8.5_r015_accumulated_final_metrics.json
          git add english-sentence-lab/artifacts/v1.8.5_r015_shared_hard_before.json
          git add english-sentence-lab/artifacts/v1.8.5_r015_shared_hard_after.json
          git add english-sentence-lab/artifacts/v1.8.5_r015_comparison.json
          git commit -m "model: persist accepted R015 accumulated candidate"
          git push origin HEAD:main
