name: Proxy Stream Viewer Test

on:
  push:
    paths:
      - "video-downloader/proxy-stream/**"
      - ".github/workflows/proxy-stream-test.yml"
  pull_request:
    paths:
      - "video-downloader/proxy-stream/**"
      - ".github/workflows/proxy-stream-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: video-downloader/proxy-stream

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            video-downloader/proxy-stream
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py test_app.py

      - name: Test resolver and HTTP Range proxy
        run: pytest -q

      - name: Smoke-test server
        run: |
          python app.py > /tmp/proxy-stream.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then
              curl -fsS http://127.0.0.1:8765/ | grep -q "Proxy Stream Viewer"
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/proxy-stream.log
          exit 1
