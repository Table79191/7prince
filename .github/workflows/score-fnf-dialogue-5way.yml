name: Score FNF Dialogue Candidates 5way

on:
  push:
    paths:
      - ".github/workflows/score-fnf-dialogue-5way.yml"

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade "yt-dlp[default]" torch transformers soundfile
      - name: Prepare cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube-cookies.txt"
          chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
      - name: Download source
        run: |
          mkdir -p input clips
          yt-dlp --no-playlist --js-runtimes node --remote-components ejs:github \
            --cookies "$RUNNER_TEMP/youtube-cookies.txt" \
            -x --audio-format wav -o "input/source.%(ext)s" \
            "https://www.youtube.com/watch?v=ZTXK5Ckx5js"
      - name: Make clips
        run: |
          ffmpeg -hide_banner -loglevel error -y -ss 75.3 -t 4.8 -i input/source.wav -ac 1 -ar 16000 clips/raw.wav
          ffmpeg -hide_banner -loglevel error -y -ss 75.3 -t 4.8 -i input/source.wav \
            -af "highpass=f=90,lowpass=f=8500,dynaudnorm=f=40:g=8" -ac 1 -ar 16000 clips/light.wav
          ffmpeg -hide_banner -loglevel error -y -ss 75.3 -t 4.8 -i input/source.wav \
            -af "highpass=f=120,lowpass=f=7000,afftdn=nr=8:nf=-50:tn=1,dynaudnorm=f=40:g=10" -ac 1 -ar 16000 clips/denoise.wav
          ffmpeg -hide_banner -loglevel error -y -ss 76.2 -t 3.6 -i input/source.wav -ac 1 -ar 16000 clips/tight.wav
      - name: CTC score candidates
        run: |
          cat > /tmp/score.py <<'PY'
          import torch, soundfile as sf
          import torch.nn.functional as F
          from pathlib import Path
          from transformers import AutoProcessor, AutoModelForCTC

          candidates = [
              "EVERYBODY LIKES ME",
              "EVERYBODY LIKE IT",
              "EVERYBODY LIKES IT",
              "EVERYBODY LET ME GO",
              "EVERYBODY LET IT GO",
          ]
          models = [
              "facebook/wav2vec2-base-960h",
              "facebook/wav2vec2-large-960h-lv60-self",
          ]

          for model_id in models:
              print("\n=== MODEL", model_id, "===")
              proc = AutoProcessor.from_pretrained(model_id)
              model = AutoModelForCTC.from_pretrained(model_id)
              model.eval()
              blank = proc.tokenizer.pad_token_id
              totals = {c: [] for c in candidates}

              for wav in sorted(Path("clips").glob("*.wav")):
                  audio, sr = sf.read(wav)
                  inp = proc(audio, sampling_rate=sr, return_tensors="pt")
                  with torch.no_grad():
                      logits = model(inp.input_values).logits
                  log_probs = F.log_softmax(logits, dim=-1).transpose(0,1)
                  T = log_probs.shape[0]
                  print("FILE", wav.name, "frames", T)
                  for cand in candidates:
                      ids = proc.tokenizer(cand).input_ids
                      targets = torch.tensor(ids, dtype=torch.long)
                      ilen = torch.tensor([T], dtype=torch.long)
                      tlen = torch.tensor([len(ids)], dtype=torch.long)
                      loss = torch.nn.functional.ctc_loss(
                          log_probs, targets.unsqueeze(0), ilen, tlen,
                          blank=blank, reduction="sum", zero_infinity=False
                      ).item()
                      norm = loss / len(ids)
                      totals[cand].append(norm)
                      print(f"CAND={cand} norm_loss={norm:.6f}")
              ranked = sorted((sum(v)/len(v), k) for k,v in totals.items())
              print("=== RANKING", model_id, "===")
              for avg, c in ranked:
                  print(f"{c}: avg_norm_loss={avg:.6f}")
              print("BEST=" + ranked[0][1])
          PY
          python /tmp/score.py
