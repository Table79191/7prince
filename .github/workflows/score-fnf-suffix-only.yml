name: Score FNF Full Phrase Final

on:
  push:
    paths:
      - ".github/workflows/score-fnf-suffix-only.yml"

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade "yt-dlp[default]" torch transformers soundfile

      - name: Prepare cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube-cookies.txt"
          chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"

      - name: Download source
        run: |
          mkdir -p input clips
          yt-dlp --no-playlist --js-runtimes node --remote-components ejs:github \
            --cookies "$RUNNER_TEMP/youtube-cookies.txt" \
            -x --audio-format wav -o "input/source.%(ext)s" \
            "https://www.youtube.com/watch?v=ZTXK5Ckx5js"

      - name: Make full phrase windows
        run: |
          # Whisper timestamps from earlier runs put the repetitions at about
          # 76.68-77.98 and 78.32-79.70 seconds.
          for spec in "76.58 1.55 first" "78.20 1.62 second"; do
            set -- $spec
            ss=$1; dur=$2; name=$3

            ffmpeg -hide_banner -loglevel error -y \
              -ss "$ss" -t "$dur" -i input/source.wav \
              -ac 1 -ar 16000 "clips/${name}-raw.wav"

            ffmpeg -hide_banner -loglevel error -y \
              -ss "$ss" -t "$dur" -i input/source.wav \
              -af "highpass=f=90,lowpass=f=8500,dynaudnorm=f=35:g=8" \
              -ac 1 -ar 16000 "clips/${name}-light.wav"

            ffmpeg -hide_banner -loglevel error -y \
              -ss "$ss" -t "$dur" -i input/source.wav \
              -af "highpass=f=120,lowpass=f=7200,afftdn=nr=6:nf=-52:tn=1,dynaudnorm=f=35:g=8" \
              -ac 1 -ar 16000 "clips/${name}-denoise.wav"
          done

      - name: CTC score full phrases
        run: |
          cat > /tmp/score.py <<'PY'
          import torch
          import soundfile as sf
          import torch.nn.functional as F
          from pathlib import Path
          from transformers import AutoProcessor, AutoModelForCTC

          candidates = [
              "EVERYBODY WOULD LIKE IT",
              "EVERYBODY'D LIKE IT",
              "EVERYBODY LIKE IT",
              "EVERYBODY LIKES IT",
              "EVERYBODY LIKES ME",
              "EVERYBODY WOULD LIKE ME",
          ]

          models = [
              "facebook/wav2vec2-base-960h",
              "facebook/wav2vec2-large-960h-lv60-self",
          ]

          for model_id in models:
              print("\n=== MODEL", model_id, "===")
              proc = AutoProcessor.from_pretrained(model_id)
              model = AutoModelForCTC.from_pretrained(model_id)
              model.eval()
              blank = proc.tokenizer.pad_token_id
              totals = {c: [] for c in candidates}

              for wav in sorted(Path("clips").glob("*.wav")):
                  audio, sr = sf.read(wav)
                  inp = proc(audio, sampling_rate=sr, return_tensors="pt")
                  with torch.no_grad():
                      logits = model(inp.input_values).logits

                  log_probs = F.log_softmax(logits, dim=-1).transpose(0, 1)
                  frames = log_probs.shape[0]
                  print("FILE", wav.name, "frames", frames)

                  for cand in candidates:
                      ids = proc.tokenizer(cand).input_ids
                      loss = F.ctc_loss(
                          log_probs,
                          torch.tensor(ids, dtype=torch.long).unsqueeze(0),
                          torch.tensor([frames], dtype=torch.long),
                          torch.tensor([len(ids)], dtype=torch.long),
                          blank=blank,
                          reduction="sum",
                          zero_infinity=False,
                      ).item()
                      norm = loss / len(ids)
                      totals[cand].append(norm)
                      print(f"CAND={cand} norm_loss={norm:.6f}")

              ranked = sorted((sum(v) / len(v), c) for c, v in totals.items())
              print("=== RANKING", model_id, "===")
              for avg, cand in ranked:
                  print(f"{cand}: avg_norm_loss={avg:.6f}")
              print("BEST=" + ranked[0][1])
          PY
          python /tmp/score.py
