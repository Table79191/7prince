name: SentenceLab autonomous corpus loop

on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/scripts/auto_web_corpus_bot.py'
      - 'english-sentence-lab/scripts/stamp_collection_times.py'
      - 'english-sentence-lab/scripts/compare_web_corpus_to_model.py'
      - 'english-sentence-lab/artifacts/*.pt'
      - '.github/workflows/sentence-lab-auto-web-corpus.yml'

permissions:
  contents: write

concurrency:
  group: sentence-lab-autonomous-corpus-loop
  cancel-in-progress: false

jobs:
  collect-analyze-compare-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run collector self-test
        run: python english-sentence-lab/scripts/auto_web_corpus_bot.py --self-test

      - name: Run collection-time self-test
        run: python english-sentence-lab/scripts/stamp_collection_times.py --self-test

      - name: Snapshot corpus state before run
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('english-sentence-lab/data/web_corpus_bot')
          state = {'sources': {}, 'total': 0}
          for path in sorted(root.glob('*.jsonl')):
              ids = []
              try:
                  with path.open(encoding='utf-8') as f:
                      for line in f:
                          if not line.strip():
                              continue
                          row = json.loads(line)
                          ids.append(str(row.get('id', '')))
              except Exception:
                  ids = []
              state['sources'][path.stem] = ids
              state['total'] += len(ids)
          Path('/tmp/sentence_lab_before.json').write_text(
              json.dumps(state, ensure_ascii=False), encoding='utf-8'
          )
          print(f"snapshot before run: {state['total']} records")
          PY

      - name: Collect already-annotated public English data
        run: |
          python english-sentence-lab/scripts/auto_web_corpus_bot.py \
            --max-per-source 1000

      - name: Stamp first collection time in UTC and KST
        run: python english-sentence-lab/scripts/stamp_collection_times.py

      - name: Record run history
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          root = Path('english-sentence-lab/data/web_corpus_bot')
          before_path = Path('/tmp/sentence_lab_before.json')
          before = json.loads(before_path.read_text(encoding='utf-8')) if before_path.exists() else {'sources': {}, 'total': 0}
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))

          current = {}
          new_rows = []
          removed_count = 0
          source_changes = []

          for key in sorted(manifest['sources']):
              path = root / f'{key}.jsonl'
              rows = []
              with path.open(encoding='utf-8') as f:
                  for line in f:
                      if line.strip():
                          rows.append(json.loads(line))

              current_ids = {str(row.get('id', '')) for row in rows}
              before_ids = set(before.get('sources', {}).get(key, []))
              added_ids = current_ids - before_ids
              removed_ids = before_ids - current_ids
              current[key] = len(current_ids)
              removed_count += len(removed_ids)

              if added_ids or removed_ids:
                  source_changes.append(f"{key}: +{len(added_ids)} / -{len(removed_ids)}")

              for row in rows:
                  rid = str(row.get('id', ''))
                  if rid in added_ids:
                      source = row.get('source', {})
                      new_rows.append({
                          'key': key,
                          'id': rid,
                          'text': str(row.get('text', '')).replace('\n', ' ').strip(),
                          'repo': source.get('repo', ''),
                          'raw_file': source.get('raw_file', source.get('filename', '')),
                          'url': source.get('url', source.get('raw_url', '')),
                      })

          after_total = sum(current.values())
          before_total = int(before.get('total', 0))
          added_count = len(new_rows)
          net_change = after_total - before_total

          now_utc = datetime.now(timezone.utc).replace(microsecond=0)
          now_kst = now_utc.astimezone(timezone(timedelta(hours=9)))
          history = root / 'RUN_HISTORY.txt'

          lines = [
              f"=== {now_kst.isoformat()} / {now_utc.isoformat()} ===",
              'status: success',
              f'before_total: {before_total}',
              f'after_total: {after_total}',
              f'net_total_change: {net_change:+d}',
              f'new_items_added: {added_count}',
              f'items_removed: {removed_count}',
              'source_changes: ' + (', '.join(source_changes) if source_changes else 'none'),
              'new_items_sample:',
          ]

          if new_rows:
              for item in new_rows[:30]:
                  text = item['text'][:220]
                  provenance = item['repo'] or item['url'] or item['raw_file'] or 'unknown-source'
                  lines.append(f"- [{item['key']}] {item['id']} | {text} | {provenance}")
              if len(new_rows) > 30:
                  lines.append(f"- ... {len(new_rows) - 30} more new items")
          else:
              lines.append('- none')
          lines.append('')

          previous = history.read_text(encoding='utf-8') if history.exists() else '# SentenceLab corpus run history\n\n'
          history.write_text(previous + '\n'.join(lines) + '\n', encoding='utf-8')
          print(f"run history: before={before_total}, after={after_total}, added={added_count}, removed={removed_count}")
          PY

      - name: Validate generated corpus files
        shell: bash
        run: |
          set -euo pipefail
          test -s english-sentence-lab/data/web_corpus_bot/manifest.json
          test -s english-sentence-lab/data/web_corpus_bot/REPORT.md
          test -s english-sentence-lab/data/web_corpus_bot/RUN_HISTORY.txt
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('english-sentence-lab/data/web_corpus_bot')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          total = 0
          for key, source in manifest['sources'].items():
              path = root / f'{key}.jsonl'
              assert path.exists() and path.stat().st_size > 0, key
              rows = 0
              with path.open(encoding='utf-8') as f:
                  for line in f:
                      row = json.loads(line)
                      assert row['source']['key'] == key
                      assert row['source']['license'] == source['license']
                      assert row['analysis']['tokens']
                      collection = row['collection']
                      assert collection['first_collected_at_utc'].endswith('+00:00')
                      assert collection['first_collected_at_kst'].endswith('+09:00')
                      rows += 1
              assert rows == source['sentences_written'], (key, rows, source['sentences_written'])
              total += rows
          assert total == manifest['totals']['sentences_written'], (total, manifest['totals'])
          assert manifest['collection_time']['records_with_timestamp'] == total
          print(f'validated {total} timestamped analyzed sentences from {len(manifest["sources"])} sources')
          PY

      - name: Detect corpus or model changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          corpus_changed=false
          if ! git diff --quiet -- english-sentence-lab/data/web_corpus_bot; then
            corpus_changed=true
          fi

          compare_needed=false
          if [ "$corpus_changed" = "true" ] || [ "${{ github.event_name }}" = "push" ] || [ ! -s english-sentence-lab/artifacts/web_corpus_comparison.txt ]; then
            compare_needed=true
          fi

          echo "corpus_changed=$corpus_changed" >> "$GITHUB_OUTPUT"
          echo "compare_needed=$compare_needed" >> "$GITHUB_OUTPUT"
          echo "corpus_changed=$corpus_changed compare_needed=$compare_needed"

      - name: Install CPU model runtime only when comparison is needed
        if: steps.changes.outputs.compare_needed == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run comparison self-test
        if: steps.changes.outputs.compare_needed == 'true'
        run: python english-sentence-lab/scripts/compare_web_corpus_to_model.py --self-test

      - name: Run current SentenceLab model and compare with original analysis
        if: steps.changes.outputs.compare_needed == 'true'
        shell: bash
        run: |
          python english-sentence-lab/scripts/compare_web_corpus_to_model.py
          test -s english-sentence-lab/artifacts/web_corpus_comparison.txt
          head -n 30 english-sentence-lab/artifacts/web_corpus_comparison.txt

      - name: Maintain monthly heartbeat so scheduled loop stays active
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('english-sentence-lab/data/web_corpus_bot/HEARTBEAT.txt')
          now = datetime.now(timezone.utc)
          refresh = True

          if path.exists():
              try:
                  first = path.read_text(encoding='utf-8').splitlines()[0].strip()
                  previous = datetime.fromisoformat(first.replace('Z', '+00:00'))
                  refresh = (now - previous).days >= 30
              except Exception:
                  refresh = True

          if refresh:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  now.replace(microsecond=0).isoformat().replace('+00:00', 'Z') + '\n'
                  'SentenceLab autonomous corpus loop heartbeat.\n'
                  'No GPT/OpenAI API is used by this workflow.\n',
                  encoding='utf-8',
              )
              print('heartbeat refreshed')
          else:
              print('heartbeat still fresh')
          PY

      - name: Commit run history plus real data, comparison, or heartbeat changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sentence-lab-corpus-bot'
          git config user.email 'sentence-lab-corpus-bot@users.noreply.github.com'
          git add english-sentence-lab/data/web_corpus_bot english-sentence-lab/artifacts/web_corpus_comparison.txt
          if git diff --cached --quiet; then
            echo 'No corpus/model/heartbeat/history changes detected.'
            exit 0
          fi
          git commit -m 'Autonomous corpus loop update'
          git pull --rebase origin main
          git push origin HEAD:main
