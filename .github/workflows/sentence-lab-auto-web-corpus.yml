name: SentenceLab autonomous corpus worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/scripts/auto_web_corpus_bot.py'
      - 'english-sentence-lab/scripts/auto_web_corpus_bot_v2.py'
      - 'english-sentence-lab/scripts/stamp_collection_times.py'
      - 'english-sentence-lab/scripts/corpus_run_history.py'
      - 'english-sentence-lab/scripts/compare_web_corpus_to_model.py'
      - 'english-sentence-lab/artifacts/*.pt'
      - '.github/workflows/sentence-lab-auto-web-corpus.yml'

permissions:
  contents: write

concurrency:
  group: sentence-lab-autonomous-corpus-worker
  cancel-in-progress: false

jobs:
  collect-analyze-compare-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run collector v2 self-test
        run: python english-sentence-lab/scripts/auto_web_corpus_bot_v2.py --self-test

      - name: Run collection-time self-test
        run: python english-sentence-lab/scripts/stamp_collection_times.py --self-test

      - name: Run history self-test
        run: python english-sentence-lab/scripts/corpus_run_history.py --self-test

      - name: Snapshot corpus before run
        run: python english-sentence-lab/scripts/corpus_run_history.py snapshot

      - name: Collect unseen annotated English data
        id: collect
        run: |
          python english-sentence-lab/scripts/auto_web_corpus_bot_v2.py \
            --max-new-per-source 250 \
            --max-total-per-source 10000

      - name: Stamp first collection time
        id: stamp
        if: steps.collect.outcome == 'success'
        run: python english-sentence-lab/scripts/stamp_collection_times.py

      - name: Validate corpus
        id: validate
        if: steps.collect.outcome == 'success' && steps.stamp.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('english-sentence-lab/data/web_corpus_bot')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == 'AUTO-WEB-CORPUS-2-INCREMENTAL'
          assert manifest['policy']['append_only'] is True
          assert manifest['policy']['authenticated_github_api'] is True

          total = 0
          for key, source in manifest['sources'].items():
              path = root / f'{key}.jsonl'
              assert path.exists() and path.stat().st_size > 0, key
              rows = 0
              ids = set()
              with path.open(encoding='utf-8') as f:
                  for line in f:
                      if not line.strip():
                          continue
                      row = json.loads(line)
                      rid = row['id']
                      assert rid not in ids, (key, rid)
                      ids.add(rid)
                      assert row['source']['key'] == key
                      assert row['source']['license'] == source['license']
                      assert row['analysis']['tokens']
                      collection = row['collection']
                      assert collection['first_collected_at_utc'].endswith('+00:00')
                      assert collection['first_collected_at_kst'].endswith('+09:00')
                      rows += 1
              assert rows == source['sentences_written'], (key, rows, source['sentences_written'])
              total += rows

          before = json.loads(Path('/tmp/sentence_lab_before.json').read_text(encoding='utf-8'))
          assert total >= int(before['total']), (before['total'], total)
          assert total == manifest['totals']['sentences_written']
          assert manifest['collection_time']['records_with_timestamp'] == total
          print(f'validated incremental corpus: before={before["total"]} after={total}')
          PY

      - name: Detect real corpus changes
        id: changes
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          corpus_changed=false
          if ! git diff --quiet -- \
            english-sentence-lab/data/web_corpus_bot/*.jsonl \
            english-sentence-lab/data/web_corpus_bot/manifest.json \
            english-sentence-lab/data/web_corpus_bot/REPORT.md; then
            corpus_changed=true
          fi

          compare_needed=false
          if [ "$corpus_changed" = "true" ] || \
             [ "${{ github.event_name }}" = "push" ] || \
             [ ! -s english-sentence-lab/artifacts/web_corpus_comparison.txt ]; then
            compare_needed=true
          fi

          echo "corpus_changed=$corpus_changed" >> "$GITHUB_OUTPUT"
          echo "compare_needed=$compare_needed" >> "$GITHUB_OUTPUT"
          echo "corpus_changed=$corpus_changed compare_needed=$compare_needed"

      - name: Install CPU model runtime
        if: steps.changes.outputs.compare_needed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run comparison self-test
        if: steps.changes.outputs.compare_needed == 'true'
        run: python english-sentence-lab/scripts/compare_web_corpus_to_model.py --self-test

      - name: Compare current model with corpus
        id: compare
        if: steps.changes.outputs.compare_needed == 'true'
        run: |
          python english-sentence-lab/scripts/compare_web_corpus_to_model.py
          test -s english-sentence-lab/artifacts/web_corpus_comparison.txt
          head -n 30 english-sentence-lab/artifacts/web_corpus_comparison.txt

      - name: Maintain monthly heartbeat
        id: heartbeat
        if: steps.validate.outcome == 'success'
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('english-sentence-lab/data/web_corpus_bot/HEARTBEAT.txt')
          now = datetime.now(timezone.utc)
          refresh = True
          if path.exists():
              try:
                  first = path.read_text(encoding='utf-8').splitlines()[0].strip()
                  previous = datetime.fromisoformat(first.replace('Z', '+00:00'))
                  refresh = (now - previous).days >= 30
              except Exception:
                  refresh = True
          if refresh:
              path.write_text(
                  now.replace(microsecond=0).isoformat().replace('+00:00', 'Z') + '\n'
                  'SentenceLab autonomous corpus worker heartbeat.\n',
                  encoding='utf-8',
              )
              print('heartbeat refreshed')
          else:
              print('heartbeat still fresh')
          PY

      - name: Determine durable run status
        id: runstatus
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          collect='${{ steps.collect.outcome }}'
          stamp='${{ steps.stamp.outcome }}'
          validate='${{ steps.validate.outcome }}'
          compare='${{ steps.compare.outcome }}'
          details="collect=$collect,stamp=$stamp,validate=$validate,compare=$compare"
          status=success
          if [ "$collect" != "success" ] || [ "$stamp" != "success" ] || [ "$validate" != "success" ]; then
            status=failure
          fi
          if [ "$compare" = "failure" ] || [ "$compare" = "cancelled" ]; then
            status=failure
          fi
          echo "$status" > /tmp/sentence_lab_status
          echo "$details" > /tmp/sentence_lab_details
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "details=$details" >> "$GITHUB_OUTPUT"

      - name: Record run history
        if: always()
        shell: bash
        run: |
          status="$(cat /tmp/sentence_lab_status 2>/dev/null || echo failure)"
          details="$(cat /tmp/sentence_lab_details 2>/dev/null || echo 'status step unavailable')"
          python english-sentence-lab/scripts/corpus_run_history.py record \
            --status "$status" \
            --details "$details"

      - name: Commit durable state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat /tmp/sentence_lab_status 2>/dev/null || echo failure)"

          git config user.name 'sentence-lab-corpus-bot'
          git config user.email 'sentence-lab-corpus-bot@users.noreply.github.com'

          if [ "$status" != "success" ]; then
            git restore --worktree -- \
              english-sentence-lab/data/web_corpus_bot/*.jsonl \
              english-sentence-lab/data/web_corpus_bot/manifest.json \
              english-sentence-lab/data/web_corpus_bot/REPORT.md \
              english-sentence-lab/data/web_corpus_bot/HEARTBEAT.txt \
              english-sentence-lab/artifacts/web_corpus_comparison.txt 2>/dev/null || true
            git add english-sentence-lab/data/web_corpus_bot/RUN_HISTORY.txt
          else
            git add \
              english-sentence-lab/data/web_corpus_bot \
              english-sentence-lab/artifacts/web_corpus_comparison.txt
          fi

          if git diff --cached --quiet; then
            echo 'No durable changes to commit.'
            exit 0
          fi

          git commit -m "SentenceLab corpus run: $status"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo 'Failed to push durable state after 3 attempts.' >&2
          exit 1
