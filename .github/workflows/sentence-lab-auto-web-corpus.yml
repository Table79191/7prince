name: SentenceLab auto web corpus bot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/scripts/auto_web_corpus_bot.py'
      - 'english-sentence-lab/scripts/compare_web_corpus_to_model.py'
      - '.github/workflows/sentence-lab-auto-web-corpus.yml'

permissions:
  contents: write

concurrency:
  group: sentence-lab-auto-web-corpus
  cancel-in-progress: false

jobs:
  collect-analyze-compare-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU model runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run collector self-test
        run: python english-sentence-lab/scripts/auto_web_corpus_bot.py --self-test

      - name: Run comparison self-test
        run: python english-sentence-lab/scripts/compare_web_corpus_to_model.py --self-test

      - name: Collect already-annotated public English data
        run: |
          python english-sentence-lab/scripts/auto_web_corpus_bot.py \
            --max-per-source 1000

      - name: Validate generated corpus files
        shell: bash
        run: |
          set -euo pipefail
          test -s english-sentence-lab/data/web_corpus_bot/manifest.json
          test -s english-sentence-lab/data/web_corpus_bot/REPORT.md
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('english-sentence-lab/data/web_corpus_bot')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          total = 0
          for key, source in manifest['sources'].items():
              path = root / f'{key}.jsonl'
              assert path.exists() and path.stat().st_size > 0, key
              rows = 0
              with path.open(encoding='utf-8') as f:
                  for line in f:
                      row = json.loads(line)
                      assert row['source']['key'] == key
                      assert row['source']['license'] == source['license']
                      assert row['analysis']['tokens']
                      rows += 1
              assert rows == source['sentences_written'], (key, rows, source['sentences_written'])
              total += rows
          assert total == manifest['totals']['sentences_written'], (total, manifest['totals'])
          print(f'validated {total} analyzed sentences from {len(manifest["sources"])} sources')
          PY

      - name: Run current SentenceLab model and compare with original analysis
        shell: bash
        run: |
          python english-sentence-lab/scripts/compare_web_corpus_to_model.py
          test -s english-sentence-lab/artifacts/web_corpus_comparison.txt
          head -n 30 english-sentence-lab/artifacts/web_corpus_comparison.txt

      - name: Commit corpus and comparison table
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sentence-lab-corpus-bot'
          git config user.email 'sentence-lab-corpus-bot@users.noreply.github.com'
          git add english-sentence-lab/data/web_corpus_bot english-sentence-lab/artifacts/web_corpus_comparison.txt
          if git diff --cached --quiet; then
            echo 'No upstream corpus/model comparison changes detected.'
            exit 0
          fi
          git commit -m 'Update analyzed corpus comparison table'
          git pull --rebase origin main
          git push origin HEAD:main
