name: SentenceLab sealed Chaos50 evaluation

on:
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/eval/eval_chaos50_v175.py'
      - 'english-sentence-lab/eval/chaos50_base_v153.json.gz.b64'
      - 'english-sentence-lab/eval/chaos50_gold.json.gz.b64'
      - '.github/workflows/sentence-lab-chaos50-eval.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chaos50-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU torch
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Evaluate sealed Chaos Long50
        run: python english-sentence-lab/eval/eval_chaos50_v175.py

      - name: Commit evaluation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sentence-lab-bot'
          git config user.email 'sentence-lab-bot@users.noreply.github.com'
          git add english-sentence-lab/artifacts/v1.7.5_chaos50_eval.json english-sentence-lab/artifacts/v1.7.5_chaos50_eval.txt
          if git diff --cached --quiet; then
            echo 'No Chaos50 report changes.'
            exit 0
          fi
          git commit -m 'Evaluate v1.7.5 on sealed Chaos Long50'
          git push
