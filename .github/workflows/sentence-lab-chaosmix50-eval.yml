name: SentenceLab ChaosMix50 evaluation

on:
  workflow_run:
    workflows: ["SentenceLab R012 school regression patch"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/eval/eval_chaosmix50.py'
      - 'english-sentence-lab/eval/eval_chaosmix50_audited.py'
      - 'english-sentence-lab/eval/eval_chaosmix50_r013.py'
      - 'english-sentence-lab/artifacts/v1.8.2_r012_school_regression_role.pt'
      - 'english-sentence-lab/scripts/spacy_role_postprocess.py'
      - 'english-sentence-lab/data/chaoslike200/ChaosMix50_ORIGINAL.json'
      - '.github/workflows/sentence-lab-chaosmix50-eval.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentence-lab-chaosmix50-main
  cancel-in-progress: true

jobs:
  chaosmix50-eval:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install spacy
          python -m spacy download en_core_web_sm

      - name: Evaluate R013 dependency guard
        run: python english-sentence-lab/eval/eval_chaosmix50_r013.py

      - name: Commit evaluation report safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name sentence-lab-bot
          git config user.email sentence-lab-bot@users.noreply.github.com
          tmp="$(mktemp -d)"
          cp 'english-sentence-lab/artifacts/r013_chaosmix50_eval.json' "$tmp/0"
          cp 'english-sentence-lab/artifacts/r013_chaosmix50_eval.txt' "$tmp/1"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p "$(dirname 'english-sentence-lab/artifacts/r013_chaosmix50_eval.json')"
            cp "$tmp/0" 'english-sentence-lab/artifacts/r013_chaosmix50_eval.json'
            mkdir -p "$(dirname 'english-sentence-lab/artifacts/r013_chaosmix50_eval.txt')"
            cp "$tmp/1" 'english-sentence-lab/artifacts/r013_chaosmix50_eval.txt'

            git add \
              'english-sentence-lab/artifacts/r013_chaosmix50_eval.json' \
              'english-sentence-lab/artifacts/r013_chaosmix50_eval.txt'
            if git diff --cached --quiet; then
              echo 'Outputs already present on latest main.'
              exit 0
            fi
            git commit -m 'eval: save R013 ChaosMix50 report'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
