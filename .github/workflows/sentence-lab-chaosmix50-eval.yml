name: SentenceLab ChaosMix50 evaluation

on:
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/eval/eval_chaosmix50.py'
      - 'english-sentence-lab/eval/eval_chaosmix50_audited.py'
      - 'english-sentence-lab/eval/eval_chaosmix50_r013.py'
      - 'english-sentence-lab/scripts/spacy_role_postprocess.py'
      - 'english-sentence-lab/data/chaoslike200/ChaosMix50_ORIGINAL.json'
      - '.github/workflows/sentence-lab-chaosmix50-eval.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chaosmix50-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install spacy
          python -m spacy download en_core_web_sm

      - name: Evaluate R013 dependency guard
        run: python english-sentence-lab/eval/eval_chaosmix50_r013.py

      - name: Commit evaluation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sentence-lab-bot'
          git config user.email 'sentence-lab-bot@users.noreply.github.com'
          git add english-sentence-lab/artifacts/r013_chaosmix50_eval.json english-sentence-lab/artifacts/r013_chaosmix50_eval.txt
          if git diff --cached --quiet; then
            echo 'No R013 report changes.'
            exit 0
          fi
          git commit -m 'eval: save R013 ChaosMix50 report'
          git pull --rebase origin main
          git push origin HEAD:main
