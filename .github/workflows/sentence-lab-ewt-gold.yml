name: SentenceLab EWT gold fine-tune

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sentence-lab-ewt-gold.yml'
      - 'english-sentence-lab/ewt_gold.trigger'

permissions:
  contents: write

jobs:
  ewt-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download official EWT Gold treebank
        run: python english-sentence-lab/scripts/download_gold_ewt.py

      - name: Fine-tune v1.7.3 with EWT Gold + replay
        shell: bash
        run: |
          cd english-sentence-lab
          python train/train_gold_ewt_replay.py \
            --base artifacts/v1.7.3_gold_replay_role.pt \
            --gold-train data/gold/gold_v2_train_18000.jsonl \
            --gold-val data/gold/gold_v2_val_4000.jsonl \
            --ewt data/gold_external/ewt \
            --ud data/ud \
            --out artifacts/v1.7.4_gold_ewt_role.pt \
            --metrics artifacts/v1.7.4_gold_ewt_metrics.json \
            --epochs 2 \
            --batch 32 \
            --replay 8000

      - name: Commit EWT Gold and trained model
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sentence-lab-bot'
          git config user.email 'sentence-lab-bot@users.noreply.github.com'
          git add english-sentence-lab/data/gold_external/ewt \
                  english-sentence-lab/artifacts/v1.7.4_gold_ewt_role.pt \
                  english-sentence-lab/artifacts/v1.7.4_gold_ewt_metrics.json
          if git diff --cached --quiet; then
            echo 'No EWT/model changes to commit.'
            exit 0
          fi
          git commit -m 'Fine-tune SentenceLab on EWT gold dependency answers'
          git push
