name: SentenceLab export R012 ONNX
on:
  workflow_run:
    workflows: ["SentenceLab R012 school regression patch"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/scripts/export_r012_onnx.py'
      - 'english-sentence-lab/scripts/browser_smoke_test.sh'
      - 'english-sentence-lab/web/r012/browser_rules.js'
      - 'english-sentence-lab/artifacts/v1.8.2_r012_school_regression_role.pt'
      - '.github/workflows/sentence-lab-export-r012-onnx.yml'
permissions:
  contents: write
concurrency:
  group: sentence-lab-r012-export-main
  cancel-in-progress: true
jobs:
  export:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx onnxruntime onnxscript
      - name: Export
        run: |
          cd english-sentence-lab
          python scripts/export_r012_onnx.py
      - name: Validate ONNX
        run: |
          cd english-sentence-lab
          python - <<'PY'
          import sys,numpy as np,torch,onnx,onnxruntime as ort
          sys.path.insert(0,'train')
          import train_ud_role as base
          ck=torch.load('artifacts/v1.8.2_r012_school_regression_role.pt',map_location='cpu',weights_only=False)
          assert ck.get('metrics',{}).get('version')=='1.8.2-R012-SCHOOL-REGRESSION'
          model=base.RoleNet().cpu();model.load_state_dict(ck['model'],strict=True);model.eval()
          L=9
          wid=torch.randint(0,8192,(1,L));pre=torch.randint(0,1024,(1,L));suf=torch.randint(0,1024,(1,L))
          pos=torch.randint(0,len(base.POS_LIST),(1,L));role=torch.randint(0,6,(1,L))
          shape=torch.rand(1,L,8);mask=torch.ones(1,L,dtype=torch.bool)
          with torch.no_grad():
              pt=model({'wid':wid,'pre':pre,'suf':suf,'pos':pos,'role':role,'shape':shape},mask).numpy()
          p='web/r012/r012_role.onnx'
          onnx.checker.check_model(onnx.load(p))
          s=ort.InferenceSession(p,providers=['CPUExecutionProvider'])
          ox=s.run(['logits'],{'wid':wid.numpy(),'pre':pre.numpy(),'suf':suf.numpy(),'pos':pos.numpy(),'role':role.numpy(),'shape':shape.numpy(),'mask':mask.numpy()})[0]
          assert float(np.max(np.abs(pt-ox)))<1e-3
          PY
      - name: Integrated browser smoke
        run: bash english-sentence-lab/scripts/browser_smoke_test.sh
      - name: Commit outputs safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name sentence-lab-bot
          git config user.email sentence-lab-bot@users.noreply.github.com

          tmp="$(mktemp -d)"
          cp 'english-sentence-lab/web/r012/r012_role.onnx' "$tmp/0"
          cp 'english-sentence-lab/web/r012/model_meta.json' "$tmp/1"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p "$(dirname 'english-sentence-lab/web/r012/r012_role.onnx')"
            cp "$tmp/0" 'english-sentence-lab/web/r012/r012_role.onnx'
            mkdir -p "$(dirname 'english-sentence-lab/web/r012/model_meta.json')"
            cp "$tmp/1" 'english-sentence-lab/web/r012/model_meta.json'

            git add \
              'english-sentence-lab/web/r012/r012_role.onnx' \
              'english-sentence-lab/web/r012/model_meta.json'
            if git diff --cached --quiet; then
              echo 'Outputs already present on latest main.'
              exit 0
            fi

            git commit -m 'web: export isolated R012 regression model'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
