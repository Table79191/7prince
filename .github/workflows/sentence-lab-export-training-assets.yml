name: SentenceLab export local training assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sentence-lab-export-training-assets.yml'
      - 'english-sentence-lab/export_assets.trigger'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spaCy English parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install spacy==3.8.11
          python -m spacy download en_core_web_sm
      - name: Package checkpoint and parser
        shell: bash
        run: |
          mkdir -p export_assets
          cp english-sentence-lab/artifacts/v1.7.5_gold_ewt_masc_role.pt export_assets/
          cp english-sentence-lab/train/train_ud_role.py export_assets/
          cp english-sentence-lab/train/train_gold_finetune.py export_assets/
          python - <<'PY'
          import en_core_web_sm, shutil
          from pathlib import Path
          src=Path(en_core_web_sm.__file__).resolve().parent
          dst=Path('export_assets/en_core_web_sm')
          shutil.copytree(src,dst,dirs_exist_ok=True)
          print(src, '->', dst)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sentence-lab-v175-local-assets
          path: export_assets/
          compression-level: 6
          retention-days: 1
