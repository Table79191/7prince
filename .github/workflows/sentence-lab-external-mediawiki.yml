name: SentenceLab external MediaWiki corpus

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/scripts/external_mediawiki_corpus_bot.py'
      - '.github/workflows/sentence-lab-external-mediawiki.yml'

permissions:
  contents: write

concurrency:
  group: sentence-lab-external-mediawiki
  cancel-in-progress: false

jobs:
  collect-analyze-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collector self-test
        run: python english-sentence-lab/scripts/external_mediawiki_corpus_bot.py --self-test

      - name: Cache Stanza English model
        uses: actions/cache@v4
        with:
          path: ~/stanza_resources
          key: stanza-en-depparse-v1-${{ runner.os }}

      - name: Install Stanza
        run: python -m pip install --upgrade stanza

      - name: Ensure English dependency model
        run: |
          python - <<'PY'
          import stanza
          stanza.download('en', processors='tokenize,pos,lemma,depparse', verbose=False)
          print('stanza English dependency model ready')
          PY

      - name: Collect MediaWiki text and build structures
        run: |
          python english-sentence-lab/scripts/external_mediawiki_corpus_bot.py             --runtime-seconds 1200

      - name: Validate MediaWiki external corpora
        run: |
          python english-sentence-lab/scripts/external_mediawiki_corpus_bot.py             --validate-only

      - name: Commit external corpora safely
        run: |
          set -euo pipefail
          git config user.name sentence-lab-mediawiki-bot
          git config user.email sentence-lab-mediawiki-bot@users.noreply.github.com

          git add english-sentence-lab/data/external_corpus_bot/mediawiki
          if git diff --cached --quiet; then
            echo 'No MediaWiki corpus changes to commit.'
            exit 0
          fi

          git commit -m 'SentenceLab external corpus: MediaWiki checkpoint'

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done

          echo 'Failed to push MediaWiki corpus checkpoint.' >&2
          exit 1
