name: SentenceLab fetch corpora and train GRU3 role model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/bootstrap.trigger'
      - '.github/workflows/sentence-lab-fetch-data.yml'

permissions:
  contents: write

jobs:
  fetch-train-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU training dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download public annotated English corpora
        run: python english-sentence-lab/scripts/download_ud.py

      - name: Show downloaded corpus manifest
        run: cat english-sentence-lab/data/ud/manifest.json

      - name: Train SentenceLab GRU3 + self-attention role network
        shell: bash
        run: |
          cd english-sentence-lab
          python train/train_ud_role.py \
            --data data/ud \
            --out artifacts/v1.7.0_ud_role.pt \
            --metrics artifacts/v1.7.0_ud_metrics.json \
            --epochs 1 \
            --batch 32 \
            --chunk-sentences 250 \
            --max-per-corpus 12000
          rm -f artifacts/latest.pt

      - name: Commit downloaded corpora and trained model
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sentence-lab-bot'
          git config user.email 'sentence-lab-bot@users.noreply.github.com'
          git add english-sentence-lab/data/ud english-sentence-lab/artifacts
          if git diff --cached --quiet; then
            echo 'No corpus/model changes to commit.'
            exit 0
          fi
          git commit -m 'Train SentenceLab GRU3 on public annotated English corpora'
          git push
