name: SentenceLab Fresh Bulk Complex50 Eval

on:
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/eval/eval_fresh_bulk_complex50.py'
      - '.github/workflows/sentence-lab-fresh-bulk-complex50.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentence-lab-fresh-bulk-complex50
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            english-sentence-lab/eval/eval_fresh_bulk_complex50.py
            english-sentence-lab/arena/run_model_arena.py
            english-sentence-lab/train
            english-sentence-lab/scripts/canonical_roles.py
            english-sentence-lab/experiments/clause_anchor_graph_v1_01
            english-sentence-lab/data/external_corpus_bot/enwiki_bulk/shards/enwiki-bulk-000036.jsonl
            english-sentence-lab/data/external_corpus_bot/enwiki_bulk/shards/enwiki-bulk-000037.jsonl
            english-sentence-lab/data/external_corpus_bot/enwiki_bulk/shards/enwiki-bulk-000038.jsonl
            english-sentence-lab/data/promoted_silver/state.json
            english-sentence-lab/artifacts/arena_hotfeed/feed_state.json
            english-sentence-lab/artifacts/arena_hotfeed/role_arena_latest.pt
            english-sentence-lab/artifacts/arena_hotfeed/clause_arena_latest.pt
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Syntax
        run: python -m py_compile english-sentence-lab/eval/eval_fresh_bulk_complex50.py

      - name: Select unseen complex sentences and evaluate both models
        run: |
          cd english-sentence-lab
          python eval/eval_fresh_bulk_complex50.py             --role-model artifacts/arena_hotfeed/role_arena_latest.pt             --clause-model artifacts/arena_hotfeed/clause_arena_latest.pt             --count 50             --max-scan 30000             --dataset-out data/eval/fresh_bulk_complex50_20260919_v2.json             --result-out artifacts/fresh_bulk_complex50_20260919_v2_results.json

      - name: Sanity gate
        run: |
          cd english-sentence-lab
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/eval/fresh_bulk_complex50_20260919_v2.json').read_text())
          r=json.loads(Path('artifacts/fresh_bulk_complex50_20260919_v2_results.json').read_text())
          assert d['training_allowed'] is False
          assert d['selection_uses_model_predictions'] is False
          assert len(d['cases']) == 50
          assert r['selection']['model_blind'] is True
          assert r['role']['sentences'] == 50
          assert r['clause']['sentences'] == 50
          assert sum(r['sentence_wins'].values()) == 50
          print(json.dumps({
            'role_full':r['role']['full_role_accuracy'],
            'role_core':r['role']['core_role_accuracy'],
            'clause_full':r['clause']['full_role_accuracy'],
            'clause_core':r['clause']['core_role_accuracy'],
            'wins':r['sentence_wins'],
          },indent=2))
          PY

      - name: Persist frozen test and results
        run: |
          set -euo pipefail
          git config user.name sentence-lab-eval-bot
          git config user.email sentence-lab-eval-bot@users.noreply.github.com
          git add --sparse english-sentence-lab/data/eval/fresh_bulk_complex50_20260919_v2.json
          git add --sparse english-sentence-lab/artifacts/fresh_bulk_complex50_20260919_v2_results.json
          git commit -m "eval: freeze fresh unseen bulk complex50 results"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: fresh-bulk-complex50-20260919-v2
          path: |
            english-sentence-lab/data/eval/fresh_bulk_complex50_20260919_v2.json
            english-sentence-lab/artifacts/fresh_bulk_complex50_20260919_v2_results.json
          retention-days: 30
