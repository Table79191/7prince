name: SentenceLab MASC Gold fine-tune

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sentence-lab-masc-gold.yml'
      - 'english-sentence-lab/masc_train.trigger'

permissions:
  contents: write

jobs:
  masc-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Fine-tune v1.7.4 with checksum-verified MASC Gold
        shell: bash
        run: |
          cd english-sentence-lab
          python train/train_gold_ewt_masc_replay.py \
            --base artifacts/v1.7.4_gold_ewt_role.pt \
            --gold-train data/gold/gold_v2_train_18000.jsonl \
            --gold-val data/gold/gold_v2_val_4000.jsonl \
            --ewt data/gold_external/ewt \
            --masc data/gold_external/masc_conll/extracted/masc-conll/data \
            --ud data/ud \
            --out artifacts/v1.7.5_gold_ewt_masc_role.pt \
            --metrics artifacts/v1.7.5_gold_ewt_masc_metrics.json \
            --epochs 2 \
            --batch 32 \
            --replay 8000

      - name: Commit MASC-trained model
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sentence-lab-bot'
          git config user.email 'sentence-lab-bot@users.noreply.github.com'
          git add english-sentence-lab/artifacts/v1.7.5_gold_ewt_masc_role.pt english-sentence-lab/artifacts/v1.7.5_gold_ewt_masc_metrics.json
          if git diff --cached --quiet; then
            echo 'No model changes to commit.'
            exit 0
          fi
          git commit -m 'Fine-tune SentenceLab on MASC Gold syntax'
          git push
