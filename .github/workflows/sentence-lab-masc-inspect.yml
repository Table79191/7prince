name: SentenceLab download and inspect MASC-CONLL Gold

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sentence-lab-masc-inspect.yml'
      - 'english-sentence-lab/masc_inspect.trigger'

permissions:
  contents: write

jobs:
  masc-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and inspect official MASC-CONLL Gold
        run: python english-sentence-lab/scripts/download_inspect_masc_conll.py

      - name: Commit MASC-CONLL and format report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sentence-lab-bot'
          git config user.email 'sentence-lab-bot@users.noreply.github.com'
          git add english-sentence-lab/data/gold_external/masc_conll
          if git diff --cached --quiet; then
            echo 'No MASC changes to commit.'
            exit 0
          fi
          git commit -m 'Add and inspect official MASC-CONLL gold corpus'
          git push
