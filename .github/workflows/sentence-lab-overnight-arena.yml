name: SentenceLab Overnight Model Arena

on:
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/arena/**'
      - '.github/workflows/sentence-lab-overnight-arena.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sentencelab-hotfeed-model-arena-v2
  cancel-in-progress: true

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            english-sentence-lab/arena
            english-sentence-lab/train/train_ud_role.py
            english-sentence-lab/scripts/canonical_roles.py
            english-sentence-lab/data/web_corpus_bot
            english-sentence-lab/data/promoted_silver/promoted.jsonl
            english-sentence-lab/artifacts/v1.8.5_r015_accumulated_final_role.pt
            english-sentence-lab/artifacts/clause_anchor_graph_v1_01_final.pt
            english-sentence-lab/artifacts/arena_hotfeed
            english-sentence-lab/experiments/clause_anchor_graph_v1_01
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Fallback bootstrap: this keeps the first arena run independent of the
      # separate persistence workflow if that workflow is still racing main.
      - name: Download validated ClauseAnchorGraph FINAL bootstrap
        uses: actions/download-artifact@v4
        with:
          name: clause-anchor-graph-v1-01-final
          path: /tmp/clause-final
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Table79191/7prince
          run-id: 35369679602

      - name: Ensure corpus scheduler is alive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          busy="$(gh api "/repos/${REPO}/actions/workflows/sentence-lab-scheduler.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
          if [ "$busy" -eq 0 ]; then
            gh workflow run sentence-lab-scheduler.yml --repo "$REPO" --ref main -f interval_seconds=300
            echo "Re-armed SentenceLab collection scheduler."
          else
            echo "Collection scheduler already active ($busy)."
          fi

      - name: Syntax
        run: |
          python -m py_compile english-sentence-lab/arena/run_model_arena.py

      - name: One-round arena smoke
        run: |
          cd english-sentence-lab
          CLAUSE_START="artifacts/clause_anchor_graph_v1_01_final.pt"
          if [ ! -f "$CLAUSE_START" ]; then
            CLAUSE_START="/tmp/clause-final/clause_anchor_graph_v1_01_final.pt"
          fi
          python arena/run_model_arena.py             --role-start artifacts/v1.8.5_r015_accumulated_final_role.pt             --clause-start "$CLAUSE_START"             --out-dir artifacts/arena_smoke             --rounds 1             --minutes 8             --probe-per-round 200
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('artifacts/arena_smoke/summary.json').read_text())
          assert s['gpt_in_loop'] is False
          assert s['rounds_this_run'] == 1
          assert s['gold_train_pool'] > 1000
          assert s['clean_dev_pool'] > 1000
          print(json.dumps({
            'rounds':s['rounds_this_run'],
            'gold_pool':s['gold_train_pool'],
            'silver_pool':s['promoted_silver_pool'],
            'role_updates':s['accepted_role_updates'],
            'clause_updates':s['accepted_clause_updates']
          },indent=2))
          PY
          rm -rf artifacts/arena_smoke

      - name: Fight autonomously with live bot feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd english-sentence-lab
          CLAUSE_START="artifacts/clause_anchor_graph_v1_01_final.pt"
          if [ ! -f "$CLAUSE_START" ]; then
            CLAUSE_START="/tmp/clause-final/clause_anchor_graph_v1_01_final.pt"
          fi

          PROMOTED="data/promoted_silver/promoted.jsonl"
          START_EPOCH="$(date +%s)"
          MAX_SECONDS=$((300 * 60))

          for LOOP in $(seq 1 24); do
            NOW="$(date +%s)"
            if [ $((NOW - START_EPOCH)) -ge $((MAX_SECONDS - 600)) ]; then
              echo "Stopping before runner timeout."
              break
            fi

            echo "=== hot-feed arena loop ${LOOP}/24 ==="
            git fetch origin main

            REMOTE_BLOB="$(git rev-parse "origin/main:english-sentence-lab/${PROMOTED}" 2>/dev/null || true)"
            LOCAL_BLOB="$(git hash-object "${PROMOTED}" 2>/dev/null || true)"
            if [ -n "$REMOTE_BLOB" ] && [ "$REMOTE_BLOB" != "$LOCAL_BLOB" ]; then
              git show "origin/main:english-sentence-lab/${PROMOTED}" > "${PROMOTED}.new"
              mv "${PROMOTED}.new" "$PROMOTED"
              echo "Hot-loaded newer promoted_silver blob: $REMOTE_BLOB"
            else
              echo "No promoted_silver update since previous round."
            fi

            python arena/run_model_arena.py \
              --role-start artifacts/v1.8.5_r015_accumulated_final_role.pt \
              --clause-start "$CLAUSE_START" \
              --out-dir artifacts/arena_hotfeed \
              --rounds 1 \
              --minutes 20 \
              --probe-per-round 6000

            python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('artifacts/arena_hotfeed/summary.json').read_text())
          last=json.loads(Path('artifacts/arena_hotfeed/history.jsonl').read_text().splitlines()[-1])
          print(json.dumps({
              'round':last['round'],
              'promoted_pool':last.get('promoted_pool_at_round'),
              'fresh_available':last.get('fresh_available_before'),
              'fresh_used':last.get('probe_fresh_silver'),
              'gold_used':last.get('probe_gold'),
              'old_or_total_silver_used':last.get('probe_silver'),
              'role_wins':last['battle']['role_wins'],
              'clause_wins':last['battle']['clause_wins'],
              'ties':last['battle']['ties'],
          },indent=2))
          PY

            sleep 10
          done

      - name: Verify autonomous arena state
        run: |
          cd english-sentence-lab
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('artifacts/arena_hotfeed/summary.json').read_text())
          assert s['version']=='SENTENCELAB-MODEL-ARENA-1'
          assert s['gpt_in_loop'] is False
          assert s['rounds_this_run'] >= 1
          assert s['safety']['official_test_used_for_training'] is False
          assert s['safety']['hardsets_used_as_training'] is False
          assert Path(s['latest_role_checkpoint']).exists()
          assert Path(s['latest_clause_checkpoint']).exists()
          print(json.dumps({
            'rounds_this_run':s['rounds_this_run'],
            'total_rounds':s['total_rounds'],
            'accepted_role_updates':s['accepted_role_updates'],
            'accepted_clause_updates':s['accepted_clause_updates'],
            'battle_totals':s['this_run_battle_totals'],
            'current':s['current']
          },ensure_ascii=False,indent=2))
          PY

      - name: Persist arena winners and battle log
        run: |
          # promoted.jsonl is only a hot-loaded working copy; the collector/promotion
          # workflows own that tracked file on main.
          git restore english-sentence-lab/data/promoted_silver/promoted.jsonl || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english-sentence-lab/artifacts/arena_hotfeed
          if git diff --cached --quiet; then
            echo "No arena changes to persist."
          else
            git commit -m "arena: persist autonomous overnight battle state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload arena snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentencelab-hotfeed-overnight-arena
          path: |
            english-sentence-lab/artifacts/arena_hotfeed/role_arena_latest.pt
            english-sentence-lab/artifacts/arena_hotfeed/clause_arena_latest.pt
            english-sentence-lab/artifacts/arena_hotfeed/history.jsonl
            english-sentence-lab/artifacts/arena_hotfeed/summary.json
            english-sentence-lab/artifacts/arena_hotfeed/feed_state.json
          retention-days: 30
          if-no-files-found: warn
