name: SentenceLab R011 canonical replay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sentence-lab-r011-canonical-replay.yml'
      - 'english-sentence-lab/train/train_r011_canonical_replay.py'
      - 'english-sentence-lab/scripts/canonical_roles.py'
permissions:
  contents: write
concurrency:
  group: sentence-lab-r011-main
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: |
          python -m py_compile english-sentence-lab/train/train_r011_canonical_replay.py
          python -m py_compile english-sentence-lab/scripts/canonical_roles.py
      - name: Train clean R011
        run: |
          cd english-sentence-lab
          python train/train_r011_canonical_replay.py --base none --ud data/ud --ewt data/gold_external/ewt --masc data/gold_external/masc_conll/extracted/masc-conll/data --out artifacts/v1.8.0_r011_canonical_role.pt --metrics artifacts/v1.8.0_r011_canonical_metrics.json --epochs 5 --batch 32
      - name: Validate clean split
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('english-sentence-lab/artifacts/v1.8.0_r011_canonical_metrics.json').read_text())
          assert m['version']=='1.8.0-R011-CANONICAL-CLEAN'
          assert m['base']=='random-init'
          assert m['policy']['official_test_never_fit_or_select'] is True
          assert m['data_stats']['ud']['official_test_excluded']>0
          assert m['data_stats']['ewt']['official_test_excluded']>0
          PY
      - name: Commit outputs safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name sentence-lab-bot
          git config user.email sentence-lab-bot@users.noreply.github.com

          tmp="$(mktemp -d)"
          cp 'english-sentence-lab/artifacts/v1.8.0_r011_canonical_role.pt' "$tmp/0"
          cp 'english-sentence-lab/artifacts/v1.8.0_r011_canonical_metrics.json' "$tmp/1"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p "$(dirname 'english-sentence-lab/artifacts/v1.8.0_r011_canonical_role.pt')"
            cp "$tmp/0" 'english-sentence-lab/artifacts/v1.8.0_r011_canonical_role.pt'
            mkdir -p "$(dirname 'english-sentence-lab/artifacts/v1.8.0_r011_canonical_metrics.json')"
            cp "$tmp/1" 'english-sentence-lab/artifacts/v1.8.0_r011_canonical_metrics.json'

            git add \
              'english-sentence-lab/artifacts/v1.8.0_r011_canonical_role.pt' \
              'english-sentence-lab/artifacts/v1.8.0_r011_canonical_metrics.json'
            if git diff --cached --quiet; then
              echo 'Outputs already present on latest main.'
              exit 0
            fi

            git commit -m 'train: rebuild clean R011 without test leakage'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
