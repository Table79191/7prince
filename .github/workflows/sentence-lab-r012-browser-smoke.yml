name: SentenceLab R012 browser smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sentence-lab-r012-browser-smoke.yml'
      - 'english-sentence-lab/scripts/browser_smoke_test.sh'
      - 'english-sentence-lab/web/r012/browser_rules.js'
      - 'english-sentence-lab/web/r012/r012_role.onnx'
      - 'english-sentence-lab/web/r012/model_meta.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentence-lab-r012-browser-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            english-sentence-lab/scripts/browser_smoke_test.sh
            english-sentence-lab/web/r012
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install numpy onnxruntime
      - name: Verify production metadata
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          meta=json.loads(Path('english-sentence-lab/web/r012/model_meta.json').read_text())
          version=meta['version']
          assert (
              version in {
                  '1.8.2-R012-SCHOOL-REGRESSION',
                  '1.8.3-AUTO-PROMOTED-SILVER',
                  '1.8.5-R015-ACCUMULATED-FINAL',
              }
              or version.startswith('1.8.4-FULL-AUTO-')
              or re.fullmatch(r'R015-ARENA-R\\d+', version)
          ), version
          checkpoint=meta['checkpoint']
          assert checkpoint.endswith('.pt'), checkpoint
          if version.startswith('R015-ARENA-'):
              assert checkpoint == 'role_arena_latest.pt', checkpoint
              assert meta.get('checkpoint_path','').endswith('/role_arena_latest.pt'), meta.get('checkpoint_path')
          else:
              assert checkpoint.endswith('_role.pt'), checkpoint
          PY
      - name: Run shared browser smoke
        run: bash english-sentence-lab/scripts/browser_smoke_test.sh
