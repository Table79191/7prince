name: SentenceLab R012 school regression patch
on:
  workflow_run:
    workflows: ["SentenceLab R012 safe corpus feed"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/train/train_r012_regression_patch.py'
      - 'english-sentence-lab/artifacts/v1.8.1_r012_safe_feed_role.pt'
      - '.github/workflows/sentence-lab-r012-regression-patch.yml'
permissions:
  contents: write
concurrency:
  group: sentence-lab-r012-regression-main
  cancel-in-progress: true
jobs:
  patch:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: |
          python -m py_compile english-sentence-lab/train/train_r012_regression_patch.py
          python -m py_compile english-sentence-lab/train/train_ud_role.py
          python -m py_compile english-sentence-lab/scripts/canonical_roles.py
      - name: Fine-tune regression patch
        run: |
          cd english-sentence-lab
          python train/train_r012_regression_patch.py --epochs 5
      - name: Validate disjoint holdout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('english-sentence-lab/artifacts/v1.8.2_r012_school_regression_metrics.json').read_text())
          rp=m['regression_patch']
          assert m['version']=='1.8.2-R012-SCHOOL-REGRESSION'
          assert rp['train_validation_overlap']==0
          assert rp['target_validation_sentences'] >= 128
          assert rp['selected']['target_validation']['neural_role_acc'] >= rp['baseline']['target_validation']['neural_role_acc'] + rp['minimum_target_validation_gain']
          assert rp['selected']['ud_dev']['neural_role_acc'] >= rp['baseline']['ud_dev']['neural_role_acc'] - rp['safety_max_ud_dev_token_regression']
          b_exact=rp['baseline']['ud_dev']['sentence_exact']/rp['baseline']['ud_dev']['sentences']
          s_exact=rp['selected']['ud_dev']['sentence_exact']/rp['selected']['ud_dev']['sentences']
          assert s_exact >= b_exact - rp['safety_max_ud_dev_exact_rate_regression']
          assert Path('english-sentence-lab/artifacts/v1.8.2_r012_school_regression_role.pt').stat().st_size>100000
          PY
      - name: Commit outputs safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name sentence-lab-bot
          git config user.email sentence-lab-bot@users.noreply.github.com

          tmp="$(mktemp -d)"
          cp 'english-sentence-lab/artifacts/v1.8.2_r012_school_regression_role.pt' "$tmp/0"
          cp 'english-sentence-lab/artifacts/v1.8.2_r012_school_regression_metrics.json' "$tmp/1"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p "$(dirname 'english-sentence-lab/artifacts/v1.8.2_r012_school_regression_role.pt')"
            cp "$tmp/0" 'english-sentence-lab/artifacts/v1.8.2_r012_school_regression_role.pt'
            mkdir -p "$(dirname 'english-sentence-lab/artifacts/v1.8.2_r012_school_regression_metrics.json')"
            cp "$tmp/1" 'english-sentence-lab/artifacts/v1.8.2_r012_school_regression_metrics.json'

            git add \
              'english-sentence-lab/artifacts/v1.8.2_r012_school_regression_role.pt' \
              'english-sentence-lab/artifacts/v1.8.2_r012_school_regression_metrics.json'
            if git diff --cached --quiet; then
              echo 'Outputs already present on latest main.'
              exit 0
            fi

            git commit -m 'train: build isolated R012 regression stage'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
