name: SentenceLab R012 school regression patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/train/train_r012_regression_patch.py'
      - '.github/workflows/sentence-lab-r012-regression-patch.yml'

permissions:
  contents: write

concurrency:
  group: sentence-lab-r012-regression-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx onnxruntime onnxscript
      - name: Syntax check
        run: |
          python -m py_compile english-sentence-lab/train/train_r012_regression_patch.py
          python -m py_compile english-sentence-lab/train/train_ud_role.py
          python -m py_compile english-sentence-lab/scripts/canonical_roles.py
      - name: Fine-tune regression patch
        run: |
          cd english-sentence-lab
          python train/train_r012_regression_patch.py --epochs 5
      - name: Update exporter version gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('english-sentence-lab/scripts/export_r012_onnx.py')
          s=p.read_text()
          s=s.replace('1.8.1-R012-SAFE-FEED-SCHOOL-HEADS','1.8.2-R012-SCHOOL-REGRESSION')
          p.write_text(s)
          PY
      - name: Export patched ONNX
        run: |
          cd english-sentence-lab
          python scripts/export_r012_onnx.py
      - name: Validate patched artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('english-sentence-lab/artifacts/v1.8.1_r012_safe_feed_metrics.json').read_text())
          assert m['version']=='1.8.2-R012-SCHOOL-REGRESSION'
          rp=m['regression_patch']
          assert rp['selected']['ud_dev']['neural_role_acc'] >= rp['baseline']['ud_dev']['neural_role_acc']-0.003
          assert rp['selected']['target']['neural_role_acc'] > rp['baseline']['target']['neural_role_acc']
          meta=json.loads(Path('english-sentence-lab/web/r012/model_meta.json').read_text())
          assert meta['version']=='1.8.2-R012-SCHOOL-REGRESSION'
          print('target baseline',rp['baseline']['target']['neural_role_acc'])
          print('target selected',rp['selected']['target']['neural_role_acc'])
          print('ud dev baseline',rp['baseline']['ud_dev']['neural_role_acc'])
          print('ud dev selected',rp['selected']['ud_dev']['neural_role_acc'])
          PY
      - name: Commit patched model
        run: |
          set -euo pipefail
          git config user.name sentence-lab-bot
          git config user.email sentence-lab-bot@users.noreply.github.com
          git add             english-sentence-lab/artifacts/v1.8.1_r012_safe_feed_role.pt             english-sentence-lab/artifacts/v1.8.1_r012_safe_feed_metrics.json             english-sentence-lab/web/r012/r012_role.onnx             english-sentence-lab/web/r012/model_meta.json             english-sentence-lab/scripts/export_r012_onnx.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'train: patch R012 school-style regressions'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
