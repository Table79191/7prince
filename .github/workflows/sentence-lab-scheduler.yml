name: SentenceLab schedule dispatcher

on:
  workflow_dispatch:
    inputs:
      interval_seconds:
        description: 'Delay before re-arming the dispatcher'
        required: false
        default: '300'
  schedule:
    # Fallback only. The self-rearming workflow_dispatch chain is primary.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sentence-lab-scheduler.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: sentence-lab-scheduler-daemon
  cancel-in-progress: false

jobs:
  dispatch-and-rearm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Resolve interval
        id: interval
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.interval_seconds }}'
          if [ "${{ github.event_name }}" = "push" ]; then
            delay=30
          elif [[ "$requested" =~ ^[0-9]+$ ]] && [ "$requested" -ge 60 ] && [ "$requested" -le 900 ]; then
            delay="$requested"
          else
            delay=300
          fi
          echo "delay=$delay" >> "$GITHUB_OUTPUT"
          echo "Dispatcher event=${{ github.event_name }} delay=${delay}s"

      - name: Dispatch corpus worker if idle
        shell: bash
        run: |
          set -euo pipefail
          busy="$(gh api             -H 'Accept: application/vnd.github+json'             "/repos/${REPO}/actions/workflows/sentence-lab-auto-web-corpus.yml/runs?per_page=20"             --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"

          if [ "$busy" -eq 0 ]; then
            for attempt in 1 2 3 4 5; do
              if gh workflow run sentence-lab-auto-web-corpus.yml --repo "$REPO" --ref main; then
                echo "Dispatched corpus worker at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo 'Could not dispatch corpus worker after retries.' >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
          else
            echo "Corpus worker already active (${busy}); skipped duplicate dispatch."
          fi

      - name: Dispatch long sentence collector if idle
        shell: bash
        run: |
          set -euo pipefail
          busy="$(gh api             -H 'Accept: application/vnd.github+json'             "/repos/${REPO}/actions/workflows/sentence-lab-long-sentence-collector.yml/runs?per_page=20"             --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"

          if [ "$busy" -eq 0 ]; then
            for attempt in 1 2 3 4 5; do
              if gh workflow run sentence-lab-long-sentence-collector.yml --repo "$REPO" --ref main; then
                echo "Dispatched long sentence collector at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo 'Could not dispatch long sentence collector after retries.' >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done
          else
            echo "Long sentence collector already active (${busy}); skipped duplicate dispatch."
          fi

      - name: Keep daemon interval
        shell: bash
        run: |
          set -euo pipefail
          delay='${{ steps.interval.outputs.delay }}'
          echo "Sleeping ${delay}s before re-arming dispatcher."
          sleep "$delay"

      - name: Re-arm dispatcher
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run sentence-lab-scheduler.yml               --repo "$REPO"               --ref main               -f interval_seconds=300; then
              echo "Re-armed dispatcher at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo 'Failed to re-arm dispatcher after retries.' >&2
          exit 1
