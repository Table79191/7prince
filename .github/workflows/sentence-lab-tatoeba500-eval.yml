name: SentenceLab Tatoeba Daily500 evaluation

on:
  workflow_run:
    workflows: ["SentenceLab R012 school regression patch"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'english-sentence-lab/eval/eval_tatoeba500.py'
      - 'english-sentence-lab/artifacts/v1.8.2_r012_school_regression_role.pt'
      - 'english-sentence-lab/artifacts/v1.8.3_auto_promoted_silver_role.pt'
      - 'english-sentence-lab/scripts/spacy_role_postprocess.py'
      - '.github/workflows/sentence-lab-tatoeba500-eval.yml'
  workflow_dispatch:

concurrency:
  group: sentence-lab-tatoeba500-${{ github.event_name }}-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tatoeba500-eval:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install spacy stanza wordfreq
          python -m spacy download en_core_web_sm
          python - <<'PY'
          import stanza
          stanza.download('en', processors='tokenize,pos,lemma,depparse', verbose=False)
          PY

      - name: Evaluate Tatoeba Daily500
        run: python english-sentence-lab/eval/eval_tatoeba500.py

      - name: Commit benchmark artifacts safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name sentence-lab-bot
          git config user.email sentence-lab-bot@users.noreply.github.com
          tmp="$(mktemp -d)"
          cp 'english-sentence-lab/artifacts/tatoeba_daily500_eval.json' "$tmp/0"
          cp 'english-sentence-lab/artifacts/tatoeba_daily500_eval.txt' "$tmp/1"
          cp 'english-sentence-lab/data/tatoeba500/TatoebaDaily500_CC0.tsv' "$tmp/2"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p "$(dirname 'english-sentence-lab/artifacts/tatoeba_daily500_eval.json')"
            cp "$tmp/0" 'english-sentence-lab/artifacts/tatoeba_daily500_eval.json'
            mkdir -p "$(dirname 'english-sentence-lab/artifacts/tatoeba_daily500_eval.txt')"
            cp "$tmp/1" 'english-sentence-lab/artifacts/tatoeba_daily500_eval.txt'
            mkdir -p "$(dirname 'english-sentence-lab/data/tatoeba500/TatoebaDaily500_CC0.tsv')"
            cp "$tmp/2" 'english-sentence-lab/data/tatoeba500/TatoebaDaily500_CC0.tsv'

            git add \
              'english-sentence-lab/artifacts/tatoeba_daily500_eval.json' \
              'english-sentence-lab/artifacts/tatoeba_daily500_eval.txt' \
              'english-sentence-lab/data/tatoeba500/TatoebaDaily500_CC0.tsv'
            if git diff --cached --quiet; then
              echo 'Outputs already present on latest main.'
              exit 0
            fi
            git commit -m 'eval: save Tatoeba Daily500 practical benchmark'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
