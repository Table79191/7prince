name: Transcribe FNF Dialogue Medium ZTXK5Ckx5js

on:
  push:
    paths:
      - ".github/workflows/transcribe-fnf-dialogue-medium-ZTXK5Ckx5js.yml"

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade "yt-dlp[default]" faster-whisper
      - name: Prepare cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube-cookies.txt"
          chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
      - name: Download source
        run: |
          mkdir -p input output
          yt-dlp --no-playlist --js-runtimes node --remote-components ejs:github             --cookies "$RUNNER_TEMP/youtube-cookies.txt"             -x --audio-format wav -o "input/source.%(ext)s"             "https://www.youtube.com/watch?v=ZTXK5Ckx5js"
      - name: Create clips
        run: |
          ffmpeg -hide_banner -loglevel error -y -ss 75 -t 5 -i input/source.wav -ac 1 -ar 16000 output/a-original.wav
          ffmpeg -hide_banner -loglevel error -y -ss 75 -t 5 -i input/source.wav             -af "highpass=f=120,lowpass=f=7000,afftdn=nr=10:nf=-48:tn=1,dynaudnorm=f=50:g=12"             -ac 1 -ar 16000 output/a-focus.wav
          ffmpeg -hide_banner -loglevel error -y -ss 76 -t 4 -i input/source.wav -ac 1 -ar 16000 output/b-original.wav
          ffmpeg -hide_banner -loglevel error -y -ss 76 -t 4 -i input/source.wav             -af "highpass=f=120,lowpass=f=7000,afftdn=nr=10:nf=-48:tn=1,dynaudnorm=f=50:g=12"             -ac 1 -ar 16000 output/b-focus.wav
      - name: Medium Whisper transcription
        run: |
          cat > /tmp/t.py <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          model = WhisperModel("medium.en", device="cpu", compute_type="int8")
          for p in sorted(Path("output").glob("*.wav")):
              print("FILE", p.name)
              segs, info = model.transcribe(
                  str(p), language="en", beam_size=10, best_of=10,
                  temperature=0.0, vad_filter=False,
                  condition_on_previous_text=False, word_timestamps=True,
                  no_speech_threshold=0.4, log_prob_threshold=-1.5,
              )
              for s in segs:
                  print(f"[{s.start:.2f}-{s.end:.2f}] {s.text.strip()}")
                  if s.words:
                      print("WORDS", " | ".join(f"{w.word.strip()}({w.probability:.2f})" for w in s.words))
          PY
          python /tmp/t.py
