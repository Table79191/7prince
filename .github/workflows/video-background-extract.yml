name: Extract YouTube background

on:
  push:
    branches: [main]
    paths:
      - "video-downloader/extract_background.py"
      - "video-downloader/background-requirements.txt"
      - ".github/workflows/video-background-extract.yml"
  workflow_dispatch:
    inputs:
      video_url:
        description: "Authorized video URL to process"
        required: false
        default: "https://www.youtube.com/watch?v=wQyi5GouFlo&list=RDYISDLGYC3U0&index=4"

permissions:
  contents: write

concurrency:
  group: video-background-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEFAULT_VIDEO_URL: "https://www.youtube.com/watch?v=wQyi5GouFlo&list=RDYISDLGYC3U0&index=4"
      VIDEO_ID: "wQyi5GouFlo"
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for yt-dlp JS challenges
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch only required project files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p video-downloader
          BASE="https://raw.githubusercontent.com/Table79191/7prince/$GITHUB_SHA"
          curl -fL --retry 4 --retry-delay 2 "$BASE/video-downloader/extract_background.py" -o video-downloader/extract_background.py
          curl -fL --retry 4 --retry-delay 2 "$BASE/video-downloader/video_downloader.py" -o video-downloader/video_downloader.py
          curl -fL --retry 4 --retry-delay 2 "$BASE/video-downloader/background-requirements.txt" -o video-downloader/background-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r video-downloader/background-requirements.txt

      - name: Synthetic recovery self-test
        run: python video-downloader/extract_background.py --self-test

      - name: Resolve URL
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.video_url }}" ]; then
            URL="${{ github.event.inputs.video_url }}"
          else
            URL="$DEFAULT_VIDEO_URL"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download target video
        shell: bash
        run: |
          set -euo pipefail
          WORK=".work/video-background"
          mkdir -p "$WORK"
          URL="${{ steps.target.outputs.url }}"

          if python video-downloader/video_downloader.py "$URL" -o "$WORK"; then
            echo "Primary downloader succeeded."
          else
            echo "Primary downloader failed; trying alternate YouTube clients."
            FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            python -m yt_dlp               --newline               --no-playlist               --js-runtimes node               --remote-components ejs:github               --extractor-args "youtube:player_client=android_vr,web_safari,web"               --ffmpeg-location "$FFMPEG"               --merge-output-format mp4               --remux-video mp4               -f "bv*+ba/b"               -o "$WORK/%(title).180B [%(id)s].%(ext)s"               "$URL"
          fi

          VIDEO="$(python -c 'from pathlib import Path; root=Path(".work/video-background"); items=[p for p in root.iterdir() if p.is_file() and p.suffix.lower() in {".mp4",".mkv",".webm",".mov"}]; assert items, "No downloaded video file found"; print(max(items,key=lambda p:p.stat().st_size))')"
          echo "VIDEO_PATH=$VIDEO" >> "$GITHUB_ENV"
          ls -lh "$VIDEO"

      - name: Recover backgrounds from sampled frames
        shell: bash
        run: |
          set -euo pipefail
          OUT="video-downloader/background-results/$VIDEO_ID"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python video-downloader/extract_background.py "$VIDEO_PATH"             --output-dir "$OUT"             --sample-interval 0.20             --max-samples 260             --max-frames-per-shot 36             --max-shots 12

      - name: Show diagnostics
        run: |
          cat "video-downloader/background-results/$VIDEO_ID/diagnostics.json"
          find "video-downloader/background-results/$VIDEO_ID" -maxdepth 1 -type f -printf "%f %k KB\n" | sort

      - name: Upload full result artifact
        uses: actions/upload-artifact@v4
        with:
          name: background-${{ env.VIDEO_ID }}
          path: video-downloader/background-results/${{ env.VIDEO_ID }}
          if-no-files-found: error
          retention-days: 14

      - name: Persist main recovered backgrounds to repository
        env:
          GH_TOKEN: "${{ github.token }}"
          REPO: "${{ github.repository }}"
          BRANCH: "${{ github.ref_name }}"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
import base64
import json
import os
import urllib.error
import urllib.parse
import urllib.request
from pathlib import Path

token = os.environ["GH_TOKEN"]
repo = os.environ["REPO"]
branch = os.environ["BRANCH"]
root = Path("video-downloader/background-results") / os.environ["VIDEO_ID"]

files = [root / "best_background.png", root / "diagnostics.json"]
files += sorted(root.glob("background_*.png"))

for path in files:
    if not path.is_file():
        continue
    repo_path = path.as_posix()
    api = f"https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(repo_path, safe='/')}"
    headers = {
        "Authorization": f"Bearer {token}",
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        "User-Agent": "video-background-extractor",
    }
    sha = None
    try:
        req = urllib.request.Request(api + "?ref=" + urllib.parse.quote(branch), headers=headers)
        with urllib.request.urlopen(req) as resp:
            sha = json.load(resp).get("sha")
    except urllib.error.HTTPError as exc:
        if exc.code != 404:
            raise

    payload = {
        "message": f"artifacts: update extracted background {path.name} [skip ci]",
        "content": base64.b64encode(path.read_bytes()).decode("ascii"),
        "branch": branch,
    }
    if sha:
        payload["sha"] = sha

    req = urllib.request.Request(
        api,
        data=json.dumps(payload).encode("utf-8"),
        headers={**headers, "Content-Type": "application/json"},
        method="PUT",
    )
    with urllib.request.urlopen(req) as resp:
        out = json.load(resp)
    print(repo_path, out["commit"]["sha"])
PY
