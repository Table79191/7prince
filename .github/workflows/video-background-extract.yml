name: Extract YouTube background

on:
  push:
    branches: [main]
    paths:
      - "video-downloader/extract_background.py"
      - "video-downloader/background-requirements.txt"
      - ".github/workflows/video-background-extract.yml"
  workflow_dispatch:
    inputs:
      video_url:
        description: "Authorized video URL to process"
        required: false
        default: "https://www.youtube.com/watch?v=wQyi5GouFlo&list=RDYISDLGYC3U0&index=4"

permissions:
  contents: write

concurrency:
  group: video-background-extract-v2
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEFAULT_VIDEO_URL: "https://www.youtube.com/watch?v=wQyi5GouFlo&list=RDYISDLGYC3U0&index=4"
      VIDEO_ID: "wQyi5GouFlo"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            video-downloader
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for yt-dlp JS challenges
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r video-downloader/background-requirements.txt
          python -m pip install "bgutil-ytdlp-pot-provider==2.0.0"

      - name: Synthetic recovery self-test
        run: python video-downloader/extract_background.py --self-test

      - name: Resolve URL
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.video_url }}" ]; then
            URL="${{ github.event.inputs.video_url }}"
          else
            URL="$DEFAULT_VIDEO_URL"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Start YouTube PO token provider
        shell: bash
        run: |
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:2.0.0
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4416/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            docker logs bgutil-provider || true
            exit 1
          fi
          python -m yt_dlp -v --simulate --extractor-args "youtube:player_client=mweb" "https://www.youtube.com/watch?v=wQyi5GouFlo" || true

      - name: Download target video
        shell: bash
        run: |
          set -u
          WORK=".work/video-background"
          mkdir -p "$WORK"
          URL="${{ steps.target.outputs.url }}"
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          COMMON="--newline --no-playlist --js-runtimes node --remote-components ejs:github --ffmpeg-location $FFMPEG --merge-output-format mp4 --remux-video mp4 -f bv*+ba/b"
          if python -m yt_dlp --newline --no-playlist --js-runtimes node --remote-components ejs:github --extractor-args "youtube:player_client=mweb" --ffmpeg-location "$FFMPEG" --merge-output-format mp4 --remux-video mp4 -f "bv*+ba/b" -o "$WORK/%(title).180B [%(id)s].%(ext)s" "$URL"; then
            echo "mweb + PO token download succeeded."
          elif python video-downloader/video_downloader.py "$URL" -o "$WORK"; then
            echo "Default downloader succeeded."
          else
            echo "mweb/default failed; trying additional clients with PO provider."
            python -m yt_dlp --newline --no-playlist --js-runtimes node --remote-components ejs:github --extractor-args "youtube:player_client=web_safari,web" --ffmpeg-location "$FFMPEG" --merge-output-format mp4 --remux-video mp4 -f "bv*+ba/b" -o "$WORK/%(title).180B [%(id)s].%(ext)s" "$URL"
          fi
          VIDEO="$(python -c 'from pathlib import Path; root=Path(".work/video-background"); items=[p for p in root.iterdir() if p.is_file() and p.suffix.lower() in {".mp4",".mkv",".webm",".mov"}]; assert items, "No downloaded video file found"; print(max(items,key=lambda p:p.stat().st_size))')"
          echo "VIDEO_PATH=$VIDEO" >> "$GITHUB_ENV"
          ls -lh "$VIDEO"

      - name: Recover backgrounds from sampled frames
        shell: bash
        run: |
          OUT="video-downloader/background-results/$VIDEO_ID"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python video-downloader/extract_background.py "$VIDEO_PATH" --output-dir "$OUT" --sample-interval 0.20 --max-samples 260 --max-frames-per-shot 36 --max-shots 12

      - name: Show diagnostics
        run: |
          cat "video-downloader/background-results/$VIDEO_ID/diagnostics.json"
          find "video-downloader/background-results/$VIDEO_ID" -maxdepth 1 -type f -printf "%f %k KB\n" | sort

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: background-${{ env.VIDEO_ID }}
          path: video-downloader/background-results/${{ env.VIDEO_ID }}
          if-no-files-found: error
          retention-days: 14

      - name: Commit extracted backgrounds
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "video-downloader/background-results/$VIDEO_ID"
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "artifacts: extract background for $VIDEO_ID [skip ci]"
            git push
          fi
