name: Extract YouTube background

on:
  push:
    branches: [main]
    paths:
      - "video-downloader/extract_background.py"
      - "video-downloader/background-requirements.txt"
      - "video-downloader/upload_background_results.py"
      - "video-downloader/alternate_video_source.py"
      - ".github/workflows/video-background-extract.yml"
  workflow_dispatch:
    inputs:
      video_url:
        description: "Authorized video URL to process"
        required: false
        default: "https://www.youtube.com/watch?v=wQyi5GouFlo&list=RDYISDLGYC3U0&index=4"

permissions:
  contents: write

concurrency:
  group: video-background-extract
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEFAULT_VIDEO_URL: "https://www.youtube.com/watch?v=wQyi5GouFlo&list=RDYISDLGYC3U0&index=4"
      VIDEO_ID: "wQyi5GouFlo"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch required project files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p video-downloader
          BASE="https://raw.githubusercontent.com/Table79191/7prince/$GITHUB_SHA"
          curl -fL --retry 4 --retry-delay 2 "$BASE/video-downloader/extract_background.py" -o video-downloader/extract_background.py
          curl -fL --retry 4 --retry-delay 2 "$BASE/video-downloader/video_downloader.py" -o video-downloader/video_downloader.py
          curl -fL --retry 4 --retry-delay 2 "$BASE/video-downloader/background-requirements.txt" -o video-downloader/background-requirements.txt
          curl -fL --retry 4 --retry-delay 2 "$BASE/video-downloader/upload_background_results.py" -o video-downloader/upload_background_results.py
          curl -fL --retry 4 --retry-delay 2 "$BASE/video-downloader/alternate_video_source.py" -o video-downloader/alternate_video_source.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r video-downloader/background-requirements.txt

      - name: Synthetic recovery self-test
        run: python video-downloader/extract_background.py --self-test

      - name: Resolve URL
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.video_url }}" ]; then
            URL="${{ github.event.inputs.video_url }}"
          else
            URL="$DEFAULT_VIDEO_URL"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Start YouTube PO token provider
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f bgutil-provider >/dev/null 2>&1 || true
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:2.0.0
          READY=0
          for i in $(seq 1 90); do
            if (echo > /dev/tcp/127.0.0.1/4416) >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            docker logs bgutil-provider || true
            exit 1
          fi
          docker ps --filter name=bgutil-provider
          python -m yt_dlp --version
          python -m yt_dlp -v --simulate --no-playlist --extractor-args "youtube:player_client=mweb" "${{ steps.target.outputs.url }}" || true

      - name: Download target video
        shell: bash
        run: |
          set -euo pipefail
          WORK=".work/video-background"
          mkdir -p "$WORK"
          URL="${{ steps.target.outputs.url }}"
          URL="${URL%%&*}"
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"

          download_with_client() {
            local LABEL="$1"
            local ARGS="$2"
            echo "Trying $LABEL with $ARGS"
            python -m yt_dlp               --newline               --no-playlist               --js-runtimes node               --remote-components ejs:github               --extractor-args "$ARGS"               --ffmpeg-location "$FFMPEG"               --merge-output-format mp4               --remux-video mp4               -f "bv*+ba/b"               -o "$WORK/%(title).180B [%(id)s].%(ext)s"               "$URL"
          }

          if download_with_client "mweb PO/no-webpage" "youtube:player_client=mweb;player_skip=webpage"; then
            echo "mweb PO/no-webpage succeeded."
          elif download_with_client "web_embedded/no-webpage" "youtube:player_client=web_embedded;player_skip=webpage,configs"; then
            echo "web_embedded succeeded."
          elif download_with_client "tv/no-webpage" "youtube:player_client=tv;player_skip=webpage,configs"; then
            echo "tv succeeded."
          elif download_with_client "tv_simply/no-webpage" "youtube:player_client=tv_simply;player_skip=webpage,configs"; then
            echo "tv_simply succeeded."
          elif download_with_client "web_safari/no-webpage" "youtube:player_client=web_safari;player_skip=webpage"; then
            echo "web_safari succeeded."
          elif download_with_client "android_vr/no-webpage" "youtube:player_client=android_vr;player_skip=webpage,configs"; then
            echo "android_vr succeeded."
          elif python video-downloader/video_downloader.py "$URL" -o "$WORK"; then
            echo "Default downloader fallback succeeded."
          else
            echo "All public unauthenticated client paths failed."
            exit 1
          fi

          VIDEO="$(python -c 'from pathlib import Path; root=Path(".work/video-background"); items=[p for p in root.iterdir() if p.is_file() and p.suffix.lower() in {".mp4",".mkv",".webm",".mov"}]; assert items, "No downloaded video file found"; print(max(items,key=lambda p:p.stat().st_size))')"
          echo "VIDEO_PATH=$VIDEO" >> "$GITHUB_ENV"
          ls -lh "$VIDEO"

      - name: Recover backgrounds
        shell: bash
        run: |
          set -euo pipefail
          OUT="video-downloader/background-results/$VIDEO_ID"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python video-downloader/extract_background.py "$VIDEO_PATH" --output-dir "$OUT" --sample-interval 0.20 --max-samples 260 --max-frames-per-shot 36 --max-shots 12

      - name: Show diagnostics
        shell: bash
        run: |
          cat "video-downloader/background-results/$VIDEO_ID/diagnostics.json"
          find "video-downloader/background-results/$VIDEO_ID" -maxdepth 1 -type f -printf "%f %k KB\n" | sort

      - name: Upload full result artifact
        uses: actions/upload-artifact@v4
        with:
          name: background-${{ env.VIDEO_ID }}
          path: video-downloader/background-results/${{ env.VIDEO_ID }}
          if-no-files-found: error
          retention-days: 14

      - name: Persist recovered backgrounds to repository
        env:
          GH_TOKEN: "${{ github.token }}"
          REPO: "${{ github.repository }}"
          BRANCH: "${{ github.ref_name }}"
        run: python video-downloader/upload_background_results.py
