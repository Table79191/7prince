name: Download requested YouTube video

on:
  push:
    paths:
      - ".github/workflows/video-download-nnyjmohbvxu.yml"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"

      - name: Download video
        env:
          SOURCE: "https://youtu.be/NNyJmOhbVXU?si=VvXH9fzElwyV0-SD"
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          mkdir -p output

          COOKIE_ARGS=()
          if [[ -n "${YOUTUBE_COOKIES:-}" ]]; then
            COOKIE_FILE="$RUNNER_TEMP/youtube-cookies.txt"
            printf '%s' "$YOUTUBE_COOKIES" > "$COOKIE_FILE"
            chmod 600 "$COOKIE_FILE"
            COOKIE_ARGS=(--cookies "$COOKIE_FILE")
          fi

          yt-dlp             --no-playlist             --js-runtimes node             --remote-components ejs:github             --merge-output-format mp4             -f "bv*+ba/b"             -o "output/video.%(ext)s"             "${COOKIE_ARGS[@]}"             "$SOURCE"

      - name: Normalize to MP4 if needed
        run: |
          set -euo pipefail
          FILE="$(find output -maxdepth 1 -type f | head -n 1)"
          test -n "$FILE"
          if [[ "$FILE" != *.mp4 ]]; then
            ffmpeg -hide_banner -loglevel error -y -i "$FILE" -c copy output/video.mp4
            rm -f "$FILE"
          fi

      - name: Verify video
        run: |
          set -euo pipefail
          test -s output/video.mp4
          ffprobe -v error             -show_entries format=duration,size             -show_entries stream=codec_type,codec_name,width,height             -of json output/video.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-NNyJmOhbVXU
          path: output/video.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
