name: Video Downloader Smoke Test

on:
  push:
    paths:
      - "video-downloader/**"
      - ".github/workflows/video-downloader-smoke.yml"
  pull_request:
    paths:
      - "video-downloader/**"
      - ".github/workflows/video-downloader-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            video-downloader
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r video-downloader/requirements.txt

      - name: Python syntax check
        run: python -m py_compile video-downloader/video_downloader.py

      - name: Downloader self test
        run: python video-downloader/video_downloader.py --self-test

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Browser test realtime viewer
        run: |
          python -m http.server 8765 --directory video-downloader > /tmp/viewer-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then
              break
            fi
            sleep 0.5
          done
          VIEWER_URL=http://127.0.0.1:8765/index.html node video-downloader/test_viewer.mjs
