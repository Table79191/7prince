name: Video Downloader Smoke Test

on:
  push:
    paths:
      - "video-downloader/**"
      - ".github/workflows/video-downloader-smoke.yml"
  pull_request:
    paths:
      - "video-downloader/**"
      - ".github/workflows/video-downloader-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            video-downloader
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r video-downloader/requirements.txt

      - name: Syntax check
        run: python -m py_compile video-downloader/video_downloader.py

      - name: Self test
        run: python video-downloader/video_downloader.py --self-test
