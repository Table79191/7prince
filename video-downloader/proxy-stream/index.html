<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proxy Stream Viewer</title>
<style>
:root{color-scheme:dark;font-family:Inter,Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#f5f7ff}
main{width:min(1100px,calc(100% - 24px));margin:auto;padding:32px 0 60px}
h1{margin:0 0 8px;font-size:clamp(28px,5vw,46px)}
p{color:#98a3b7;line-height:1.65}
form{display:grid;grid-template-columns:1fr auto;gap:10px;margin:22px 0 12px}
input,button,.download{font:inherit;border-radius:12px}
input{padding:14px 16px;background:#111622;color:#fff;border:1px solid #2a3241;outline:none}
button,.download{padding:0 22px;border:0;background:#596cff;color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button:disabled{opacity:.55;cursor:wait}
#status{min-height:28px;color:#aab3c6}
#status.error{color:#ff9c9c}
#meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:8px 0 14px;font-size:14px;color:#8d98ab}
.download{min-height:38px;background:#1e9b63}
.download[hidden]{display:none}
.player{aspect-ratio:16/9;background:#000;border:1px solid #242b39;border-radius:18px;overflow:hidden}
video{width:100%;height:100%;display:block;background:#000}
small{display:block;margin-top:16px;color:#6f7b90;line-height:1.6}
@media(max-width:650px){form{grid-template-columns:1fr}button{min-height:48px}.download{width:100%;min-height:46px}}
</style>
</head>
<body>
<main>
<h1>Proxy Stream Viewer</h1>
<p>YouTube 링크를 해석해 서버가 재생 가능한 미디어 주소를 얻고, 재생하거나 파일로 저장합니다.</p>
<form id="form">
<input id="url" type="url" placeholder="YouTube 링크 붙여넣기" autocomplete="off" required>
<button id="play" type="submit">불러오기</button>
</form>
<div id="status">URL을 입력하세요.</div>
<div id="meta">
  <span id="metaText"></span>
  <a id="download" class="download" href="#" download hidden>영상 다운로드</a>
</div>
<div class="player"><video id="video" controls playsinline preload="metadata"></video></div>
<small>서버 IP가 YouTube 봇 확인에 걸리는 환경에서는 서버에 YouTube 쿠키 설정이 필요할 수 있습니다.</small>
</main>
<script>
const form=document.querySelector('#form');
const input=document.querySelector('#url');
const button=document.querySelector('#play');
const statusEl=document.querySelector('#status');
const metaText=document.querySelector('#metaText');
const download=document.querySelector('#download');
const video=document.querySelector('#video');

function status(text,error=false){
  statusEl.textContent=text;
  statusEl.className=error?'error':'';
}

async function resolveAndPlay(raw){
  button.disabled=true;
  metaText.textContent='';
  download.hidden=true;
  download.removeAttribute('href');
  status('스트림 주소를 확인하는 중…');
  video.removeAttribute('src');
  video.load();

  try{
    const res=await fetch('/api/resolve',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:raw})
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'스트림을 불러오지 못했습니다.');

    video.src=data.stream;
    const f=data.format||{};
    const quality=f.height?f.height+'p':'';
    metaText.textContent=[data.title,quality,f.ext].filter(Boolean).join(' · ');
    download.href=data.download;
    download.hidden=false;
    status('준비 완료. 재생하거나 다운로드할 수 있습니다.');
    try{await video.play()}catch{}
    const here=new URL(location.href);
    here.searchParams.set('url',raw);
    history.replaceState(null,'',here);
  }catch(err){
    status(err.message||String(err),true);
  }finally{
    button.disabled=false;
  }
}

form.addEventListener('submit',e=>{
  e.preventDefault();
  resolveAndPlay(input.value.trim());
});

video.addEventListener('error',()=>{
  status('재생 중 스트림이 만료되었거나 원본 연결이 끊겼습니다. 다시 불러오세요.',true);
});

const initial=new URL(location.href).searchParams.get('url');
if(initial){
  input.value=initial;
  resolveAndPlay(initial);
}
</script>
</body>
</html>
